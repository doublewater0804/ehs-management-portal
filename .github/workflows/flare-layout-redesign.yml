name: Apply FLARE layout redesign

on:
  push:
    paths:
      - '.github/workflows/flare-layout-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch FLARE layout loader and cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260824-1044'

          index = Path('FLARE/index.html')
          s = index.read_text(encoding='utf-8')
          s, n = re.subn(
              r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";',
              f'from "../firebase-mobile-auth.js?v={version}";',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('FLARE firebase-mobile-auth import not found')
          index.write_text(s, encoding='utf-8')

          auth = Path('firebase-mobile-auth.js')
          s = auth.read_text(encoding='utf-8')

          s, n = re.subn(
              r"flareRestoreActions\.src = '\./restore-actions\.js(?:\?v=[^']+)?';",
              f"flareRestoreActions.src = './restore-actions.js?v={version}';",
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('FLARE restore-actions loader not found')

          layout_loader = f'''\n    if (!document.querySelector('script[data-ehs-flare-layout-redesign]')) {{\n      const flareLayoutRedesign = document.createElement('script');\n      flareLayoutRedesign.src = './layout-redesign.js?v={version}';\n      flareLayoutRedesign.defer = true;\n      flareLayoutRedesign.dataset.ehsFlareLayoutRedesign = '1';\n      document.head.appendChild(flareLayoutRedesign);\n    }}\n'''

          marker = "    if (!document.querySelector('script[data-ehs-flare-restore-actions]')) {"
          if 'data-ehs-flare-layout-redesign' not in s:
              if marker not in s:
                  raise SystemExit('FLARE loader insertion marker not found')
              s = s.replace(marker, layout_loader + '\n' + marker, 1)
          else:
              s = re.sub(
                  r"flareLayoutRedesign\.src = '\./layout-redesign\.js(?:\?v=[^']+)?';",
                  f"flareLayoutRedesign.src = './layout-redesign.js?v={version}';",
                  s,
                  count=1
              )

          auth.write_text(s, encoding='utf-8')
          PY

      - name: Commit production layout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html firebase-mobile-auth.js FLARE/layout-redesign.js FLARE/data-input.html
          git rm .github/workflows/flare-layout-redesign.yml
          git commit -m 'feat: separate FLARE report and data input layouts'
          git push origin main
