<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EHS 管理入口平台</title><link rel="stylesheet" href="portal/styles.css?v=storage-1"></head>
<body>
<header><div class="header-inner"><a class="brand" href="#"><span class="shield" aria-hidden="true"><svg width="38" height="44" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 6v8c0 5 5 9 9 12 4-3 9-7 9-12V6Z"/><path d="m7 13 3 3 7-7"/></svg></span><span><strong>EHS 管理入口平台</strong><small>安衛環工作整合入口</small></span></a><div class="header-actions"><label class="search"><span>搜尋</span><input id="search" disabled type="search" placeholder="搜尋系統" aria-label="搜尋系統"></label><button id="manage" class="quiet" hidden>管理者</button></div></div></header>
<main><div class="page-title"><h1 id="page-title">工作首頁</h1><span id="total" class="badge"></span></div><p id="notice" role="status" hidden></p>
<div id="home" hidden><section class="panel" id="favorites-panel"><div class="section-heading"><h2>常用系統</h2><span>快速進入日常工作</span></div><div id="favorites" class="grid"></div></section><section class="panel"><div class="section-heading"><h2>功能分類</h2><span>請選擇類別，查看相關系統</span></div><div id="categories" class="grid"></div></section></div>
<section id="listing" class="panel" hidden><nav id="category-nav" aria-label="功能分類"></nav><div class="section-heading"><h2 id="list-title"></h2><span id="list-count"></span></div><div id="systems" class="grid"></div></section>
<section id="admin-panel" class="panel" hidden><div class="section-heading"><h2>帳號與入口管理</h2><button id="close-admin" class="quiet">返回首頁</button></div><p id="auth-status" role="status"></p><button id="login">使用 Google 帳號登入</button><button id="logout" class="quiet" hidden>登出管理後台</button><div id="editor" hidden><div class="toolbar"><p>新增或編輯後，按「儲存至雲端」套用到入口網站。</p><button id="add">＋ 新增系統</button></div><div id="admin-list"></div>
<form id="system-form" hidden><h3 id="form-title">新增系統</h3><input name="id" type="hidden"><label>系統名稱<input name="title" required maxlength="80"></label><label>所屬分類<select name="category" required></select></label><label>系統網址<input name="href" required maxlength="2048" placeholder="https://… 或 training/index.html"></label><label>用途說明<textarea name="description" maxlength="300" rows="3"></textarea></label><label>顯示順序<input name="order" type="number" min="0" max="99999" step="1" required value="100"></label><div class="checks"><label><input name="visible" type="checkbox" checked>顯示在入口</label><label><input name="favorite" type="checkbox">設為常用系統</label></div><div class="toolbar"><button type="submit">儲存至雲端</button><button id="cancel-edit" type="button" class="quiet">取消</button></div></form></div></section>
<noscript>請啟用 JavaScript 以查看系統入口。</noscript></main><footer>各系統維持原有登入方式，並以新分頁開啟。</footer><script type="module" src="portal/app.js?v=storage-1"></script></body></html>
