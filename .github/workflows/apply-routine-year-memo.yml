name: Apply routine yearly memo

on:
  push:
    branches: [add-routine-year-memo-20260814]
    paths: [.github/workflows/apply-routine-year-memo.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-routine-year-memo-20260814
      - name: Patch yearly memo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('routine-work/index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: target not found')
              s=s.replace(old,new,1)

          once('#monthMemo{width:100%;min-height:110px;border:1px solid #d6e1ef;border-radius:14px;padding:12px;font-weight:850;line-height:1.6;background:#fff}',
               '#yearMemo,#monthMemo{width:100%;min-height:110px;max-width:100%;border:1px solid #d6e1ef;border-radius:14px;padding:12px;font-weight:850;line-height:1.6;background:#fff;resize:both;overflow:auto}',
               'memo css')

          month_card='''      <div class="card panel memo-card">\n        <div class="memo-head">\n          <div>\n            <h3>備註</h3>'''
          year_card='''      <div class="card panel memo-card">\n        <div class="memo-head">\n          <div>\n            <h3>年度備註</h3>\n            <div class="memo-sub" id="yearMemoSub">可記錄本年度重點事項、跨月份追蹤、年度會議結論與補充說明。</div>\n          </div>\n          <div class="memo-actions">\n            <button class="btn" onclick="clearYearMemo()">清空</button>\n            <button class="btn primary" onclick="saveYearMemo()">儲存備註</button>\n          </div>\n        </div>\n        <textarea id="yearMemo" maxlength="3000" oninput="updateYearMemoCount()" placeholder="可在此記錄本年度重點事項、跨月份追蹤、年度會議結論與補充說明"></textarea>\n        <div class="memo-count" id="yearMemoCount">0 / 3000</div>\n      </div>\n'''+month_card
          once(month_card,year_card,'year memo html')

          once('''  s.history=s.history||[];\n  s.memos=s.memos||{};\n  return s;''',
               '''  s.history=s.history||[];\n  s.memos=s.memos||{};\n  s.yearMemos=s.yearMemos||{};\n  return s;''','normalize yearMemos')

          once('''function showPage(page){\n  if(document.getElementById('monthMemo')){state.memos=state.memos||{};state.memos[memoKey()]=monthMemo.value.trim();saveState();}\n  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));''',
               '''function showPage(page){\n  saveVisibleMemos(false);\n  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));''','showPage save')

          once('''  renderSettings();\n  renderMemo();\n  saveState(false);''',
               '''  renderSettings();\n  renderYearMemo();\n  renderMemo();\n  saveState(false);''','renderAll year memo')

          old='''function saveMemoBeforeRender(){\n  if(document.getElementById('monthMemo')){state.memos=state.memos||{};state.memos[memoKey()]=monthMemo.value.trim();saveState();}\n  renderAll();\n}\nfunction memoKey(){\n  return `${Number(yearFilter.value)}-${String(Number(monthFilter.value.replace("月",""))).padStart(2,"0")}`;\n}\nfunction renderMemo(){\n  if(!document.getElementById("monthMemo")) return;\n  const y=Number(yearFilter.value);\n  const m=Number(monthFilter.value.replace("月",""));\n  memoSub.textContent=`${y} 年 ${m} 月備註：可記錄本月追蹤事項、跨部門提醒、會議結論與補充說明。`;\n  monthMemo.value=state.memos?.[memoKey()]||"";\n  updateMemoCount();\n}\nfunction updateMemoCount(){\n  if(!document.getElementById("monthMemo")) return;\n  memoCount.textContent=`${monthMemo.value.length} / 1000`;\n}\nfunction saveMemo(){\n  state.memos=state.memos||{};\n  state.memos[memoKey()]=monthMemo.value.trim();\n  saveState();\n  toastMsg("備註已儲存");\n}\nfunction clearMemo(){\n  if(!confirm("確定清空本月備註？")) return;\n  monthMemo.value="";\n  saveMemo();\n}\n'''
          new='''function saveVisibleMemos(syncCloud=true){\n  let changed=false;\n  if(document.getElementById("yearMemo") && yearMemo.dataset.key){\n    state.yearMemos=state.yearMemos||{};\n    state.yearMemos[yearMemo.dataset.key]=yearMemo.value.trim();\n    changed=true;\n  }\n  if(document.getElementById("monthMemo") && monthMemo.dataset.key){\n    state.memos=state.memos||{};\n    state.memos[monthMemo.dataset.key]=monthMemo.value.trim();\n    changed=true;\n  }\n  if(changed) saveState(syncCloud);\n}\nfunction saveMemoBeforeRender(){\n  saveVisibleMemos(true);\n  renderAll();\n}\nfunction memoKey(){\n  return `${Number(yearFilter.value)}-${String(Number(monthFilter.value.replace("月",""))).padStart(2,"0")}`;\n}\nfunction yearMemoKey(){\n  return String(Number(yearFilter.value));\n}\nfunction renderYearMemo(){\n  if(!document.getElementById("yearMemo")) return;\n  const y=Number(yearFilter.value);\n  const key=yearMemoKey();\n  yearMemoSub.textContent=`${y} 年年度備註：可記錄本年度重點事項、跨月份追蹤、年度會議結論與補充說明。`;\n  yearMemo.dataset.key=key;\n  yearMemo.value=state.yearMemos?.[key]||"";\n  updateYearMemoCount();\n}\nfunction updateYearMemoCount(){\n  if(!document.getElementById("yearMemo")) return;\n  yearMemoCount.textContent=`${yearMemo.value.length} / 3000`;\n}\nfunction saveYearMemo(){\n  state.yearMemos=state.yearMemos||{};\n  const key=yearMemo.dataset.key||yearMemoKey();\n  state.yearMemos[key]=yearMemo.value.trim();\n  saveState();\n  toastMsg("年度備註已儲存");\n}\nfunction clearYearMemo(){\n  if(!confirm("確定清空本年度備註？")) return;\n  yearMemo.value="";\n  saveYearMemo();\n}\nfunction renderMemo(){\n  if(!document.getElementById("monthMemo")) return;\n  const y=Number(yearFilter.value);\n  const m=Number(monthFilter.value.replace("月",""));\n  const key=memoKey();\n  memoSub.textContent=`${y} 年 ${m} 月備註：可記錄本月追蹤事項、跨部門提醒、會議結論與補充說明。`;\n  monthMemo.dataset.key=key;\n  monthMemo.value=state.memos?.[key]||"";\n  updateMemoCount();\n}\nfunction updateMemoCount(){\n  if(!document.getElementById("monthMemo")) return;\n  memoCount.textContent=`${monthMemo.value.length} / 1000`;\n}\nfunction saveMemo(){\n  state.memos=state.memos||{};\n  const key=monthMemo.dataset.key||memoKey();\n  state.memos[key]=monthMemo.value.trim();\n  saveState();\n  toastMsg("備註已儲存");\n}\nfunction clearMemo(){\n  if(!confirm("確定清空本月備註？")) return;\n  monthMemo.value="";\n  saveMemo();\n}\n'''
          once(old,new,'memo functions')

          once('''state=normalize({tasks:[],categories:[...DEFAULT_CATEGORIES],departments:[...DEFAULT_DEPTS],people:[],history:[],memos:{}});''',
               '''state=normalize({tasks:[],categories:[...DEFAULT_CATEGORIES],departments:[...DEFAULT_DEPTS],people:[],history:[],memos:{},yearMemos:{}});''','clear data yearMemos')

          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="yearMemo"' routine-work/index.html
          grep -q 'function renderYearMemo' routine-work/index.html
          grep -q 'resize:both' routine-work/index.html
          grep -q 's.yearMemos=s.yearMemos||{}' routine-work/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add routine-work/index.html
          git commit -m 'feat: add yearly memo to routine-work dashboard [skip ci]'
          git push origin HEAD:add-routine-year-memo-20260814
