name: Force FLARE cache refresh

on:
  push:
    paths:
      - '.github/workflows/force-flare-cache-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Force fresh FLARE scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260824-0940'

          index = Path('FLARE/index.html')
          text = index.read_text(encoding='utf-8')
          old = 'from "../firebase-mobile-auth.js";'
          new = f'from "../firebase-mobile-auth.js?v={version}";'
          if old not in text:
              # also normalize any prior query version
              import re
              text2, n = re.subn(r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";', new, text, count=1)
              if n != 1:
                  raise SystemExit('firebase-mobile-auth import not found in FLARE/index.html')
              text = text2
          else:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          auth = Path('firebase-mobile-auth.js')
          text = auth.read_text(encoding='utf-8')
          import re
          text2, n = re.subn(r"flareRestoreActions\.src = '\./restore-actions\.js(?:\?v=[^']+)?';",
                             f"flareRestoreActions.src = './restore-actions.js?v={version}';", text, count=1)
          if n != 1:
              raise SystemExit('restore-actions loader not found in firebase-mobile-auth.js')
          auth.write_text(text2, encoding='utf-8')

          restore = Path('FLARE/restore-actions.js')
          text = restore.read_text(encoding='utf-8')
          text2, n = re.subn(r"syncFix\.src = '\./cloud-sync-fix\.js(?:\?v=[^']+)?';",
                             f"syncFix.src = './cloud-sync-fix.js?v={version}';", text, count=1)
          if n != 1:
              raise SystemExit('cloud-sync-fix loader not found in restore-actions.js')
          restore.write_text(text2, encoding='utf-8')
          PY

      - name: Commit cache-busting fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html firebase-mobile-auth.js FLARE/restore-actions.js
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: force fresh FLARE restore scripts'
          git push origin main
