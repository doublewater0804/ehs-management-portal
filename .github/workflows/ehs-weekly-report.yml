name: EHS Discord weekly report (R1.0.2)
on:
  # GitHub Actions 至少間隔 5 分鐘；避開整點尖峰。實際觸發可能延遲。
  schedule:
    - cron: '3-58/5 * * * *'
  # 僅用來處理「Discord 測試佇列」；不會手動補送正式週報。
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ehs-weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependency
        working-directory: weekly-report
        run: npm install --no-audit --no-fund
      - name: Check configuration, manual requests, and schedule
        working-directory: weekly-report
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node runner.mjs
