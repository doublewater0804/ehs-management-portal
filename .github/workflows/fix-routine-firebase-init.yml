name: Fix routine Firebase init
on:
  push:
    branches: [fix-routine-firebase-init-20260814]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("routine-work/index.html"); s=p.read_text(encoding="utf-8"); pattern=r"async function setupFirebaseSync\(\)\{\s*if\(!window\.__firebaseReady\)\{.*?return;\s*\}\s*try\{\s*cloudApi=await window\.__firebaseReady;"; replacement="async function waitForFirebaseReady(timeoutMs=10000){\n  const started=Date.now();\n  while(!window.__firebaseReady){\n    if(Date.now()-started>=timeoutMs) throw new Error(\"Firebase SDK 載入逾時\");\n    await new Promise(resolve=>setTimeout(resolve,50));\n  }\n  return window.__firebaseReady;\n}\nasync function setupFirebaseSync(){\n  try{\n    updateCloudStatus(\"warn\",\"Firebase 載入中\");\n    cloudApi=await waitForFirebaseReady();"; s,n=re.subn(pattern,replacement,s,count=1,flags=re.S); assert n==1,n; s=s.replace("if(!cloudApi) cloudApi=await window.__firebaseReady;","if(!cloudApi) cloudApi=await waitForFirebaseReady();",1); p.write_text(s,encoding="utf-8")'
          grep -q 'async function waitForFirebaseReady' routine-work/index.html
          grep -q 'cloudApi=await waitForFirebaseReady();' routine-work/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add routine-work/index.html
          git commit -m 'fix: wait for Firebase module before routine-work sync [skip ci]'
          git push
