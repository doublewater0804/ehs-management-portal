name: Fix FLARE core sync 1008

on:
  push:
    paths:
      - '.github/workflows/fix-flare-core-sync-1008.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch core synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('FLARE/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''    let firstSnapshot = true;
    window.__flareCloudPush = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() }, { merge: true });
    };
    window.__flareCloudUploadLocal = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() }, { merge: true });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") {
          window.__applyFlareCloudState(data.state);
        }
      } else if (firstSnapshot) {
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });'''

          new = '''    let firstSnapshot = true;
    window.__flareCloudHydrated = false;
    window.__flareCloudHydrationFailed = false;

    // state 是完整快照；禁止 merge 巢狀 map，避免已移除的 excludedDays key 被舊資料保留。
    window.__flareCloudPush = async (state) => {
      if (window.__flareCloudHydrated !== true) {
        throw new Error("Firestore 初始資料尚未載入完成，已阻止本機覆蓋雲端。");
      }
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() });
    };
    window.__flareCloudUploadLocal = async (state) => {
      if (window.__flareCloudHydrated !== true) {
        throw new Error("Firestore 初始資料尚未載入完成，暫時禁止本機覆蓋雲端。");
      }
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") {
          window.__applyFlareCloudState(data.state);
        }
        window.__flareCloudHydrated = true;
        window.__flareCloudHydrationFailed = false;
      } else if (firstSnapshot) {
        window.__flareCloudHydrated = true;
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      window.__flareCloudHydrated = false;
      window.__flareCloudHydrationFailed = true;
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });'''

          if old not in text:
              raise SystemExit('core Firestore block not found')
          text = text.replace(old, new, 1)

          old = '''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);'''
          new = '''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (window.__flareCloudHydrated !== true) {
                setFirebaseSyncStatus(window.__flareCloudHydrationFailed
                    ? '☁️ 雲端同步失敗，已阻止本機覆蓋雲端'
                    : '☁️ 等待雲端初始同步，暫不寫入', window.__flareCloudHydrationFailed ? 'err' : 'warn');
                return;
            }
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);'''
          if old not in text:
              raise SystemExit('queueFlareCloudSave block not found')
          text = text.replace(old, new, 1)

          old = '''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            saveData();
            renderAll();'''
          new = '''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            // 首次載入只讀：禁止尚未取得 Firestore 第一份 snapshot 前，把 localStorage 反向寫回雲端。
            renderAll();'''
          if old not in text:
              raise SystemExit('window.onload saveData block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make FLARE initialization cloud-first'
          git push origin main
