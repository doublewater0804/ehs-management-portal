name: Fix FLARE restore button

on:
  push:
    paths:
      - '.github/workflows/fix-flare-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch FLARE restore click handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('FLARE/index.html')
          text = path.read_text(encoding='utf-8')

          old_onload = """            bindExclusionModalEvents();
            bindSchedulePeriodEvents();"""
          new_onload = """            bindExclusionModalEvents();
            bindExclusionActionEvents();
            bindSchedulePeriodEvents();"""
          if old_onload not in text:
              raise SystemExit('Could not find onload insertion point')
          text = text.replace(old_onload, new_onload, 1)

          anchor = """        function openExclusionModal() {
"""
          inserted = """        function bindExclusionActionEvents() {
            const restoreBodies = ['excluded-days-body', 'excluded-days-modal-body'];
            restoreBodies.forEach(id => {
                const body = document.getElementById(id);
                if (!body || body.dataset.restoreHandlerBound === '1') return;
                body.dataset.restoreHandlerBound = '1';
                body.addEventListener('click', (event) => {
                    const button = event.target.closest('button');
                    if (!button || !body.contains(button) || button.textContent.trim() !== '恢復') return;

                    // 使用事件委派接管「恢復」操作，避免動態產生的 inline onclick 在部分瀏覽器環境失效。
                    event.preventDefault();
                    event.stopPropagation();

                    const row = button.closest('tr');
                    const cells = row ? row.querySelectorAll('td') : [];
                    const dateISO = cells[0]?.textContent?.trim() || '';
                    const factory = cells[1]?.textContent?.trim() || '';
                    if (!factory || !dateISO) {
                        alert('無法讀取要恢復的資料，請重新整理頁面後再試。');
                        return;
                    }
                    restoreDay(factory, dateISO);
                }, true);
            });
        }

        function openExclusionModal() {
"""
          if anchor not in text:
              raise SystemExit('Could not find exclusion modal insertion point')
          text = text.replace(anchor, inserted, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- FLARE/index.html; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html
          git commit -m 'fix: make FLARE restore button reliable'
          git push origin main
