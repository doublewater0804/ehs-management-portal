name: Apply annual project optimization

on:
  push:
    branches:
      - project-optimization-20260813

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project/index.html
        shell: bash
        run: |
          cat tools/project_payload/part*.txt > /tmp/project_payload.b64
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('/tmp/project_payload.b64').read_text().strip()
          content = zlib.decompress(base64.b64decode(payload))
          Path('project/index.html').write_bytes(content)
          PY
      - name: Verify generated file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('project/index.html')
          assert p.exists() and p.stat().st_size > 50000
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = '3567e46a7cc55c3e825b32d080d147fc3beef9615dd4ca88019576cace2d1898'
          assert digest == expected, f'SHA256 mismatch: {digest}'
          text = data.decode('utf-8')
          for marker in ['年度專案｜基本資料管理', '辦理進度紀錄', '法規類別（可複選）', '由進度紀錄更新']:
              assert marker in text, marker
          print('Verified', digest, len(data))
          PY
      - name: Commit generated project module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Optimize annual EHS project management"
            git push
          fi
