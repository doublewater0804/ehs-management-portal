<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事故調查輪值人員管理</title><link rel="stylesheet" href="style.css?v=20260916-v3"></head>
<body><header><div><a href="../index.html?v=20260916-v3#incident">← EHS 入口／意外事故調查</a><h1>事故調查輪值人員管理</h1><span>台灣 · 大陸 · 越南</span></div><div class="toolbar"><span id="account"></span><button id="login" disabled>Google 登入</button><button id="logout" hidden>登出</button></div></header>
<main><p id="status" role="status" aria-live="polite">正在連接登入服務…</p><div id="content" hidden>
<div class="toolbar controls"><nav aria-label="管理頁面"><button data-tab="overview" aria-pressed="true">輪值與調查紀錄</button><button data-tab="roster" aria-pressed="false">各地人員名冊</button><button data-tab="rules" aria-pressed="false">輪值規定與說明</button></nav><div class="toolbar"><button id="edit" hidden>編輯資料</button><button id="import" hidden>匯入新增資料</button><button id="print">列印表單</button></div></div>
<div id="import-panel" class="panel controls" hidden><h2>匯入新增資料</h2><p>預設保留現有名冊；勾選修訂版更新可取代海外內容。既有調查紀錄不會被覆蓋或重複新增。</p><label><input type="checkbox" id="apply-duty"> 同時套用匯入檔的下次輪值設定</label><label><input type="checkbox" id="replace-overseas"> 依本次修訂版更新海外名冊與規定（取代既有海外內容）</label><label>選擇名冊 JSON<input id="import-file" type="file" accept=".json,application/json"></label></div>
<div id="print-panel" class="panel controls" hidden><h2>列印表單</h2><label>選擇表單<select id="print-kind"><option value="tw">台灣人員名冊（含規定）</option><option value="cn">大陸人員名冊（含規定）</option><option value="vn">越南人員名冊（含規定）</option><option value="overview">輪值與調查紀錄</option></select></label><div class="toolbar"><button id="print-go">預覽並列印</button><button id="print-close">關閉</button></div></div>
<div id="editor-actions" class="toolbar controls" hidden><span>編輯中 · 尚未儲存</span><button id="save" class="primary">儲存至雲端</button><button id="cancel">取消編輯</button></div>
<section id="overview" class="view"></section><section id="roster" class="view" hidden></section><section id="rules" class="view" hidden></section>
</div><noscript>請啟用 JavaScript 以查看名冊。</noscript></main><footer>版本 20260916-v3 · 資料儲存於 Firebase</footer>
<div id="print-root" aria-hidden="true"></div><script type="module">import('./app.js?v=20260916-v3').catch(()=>{document.getElementById('status').textContent='程式載入失敗，請檢查網路後重新整理。';});</script></body></html>
