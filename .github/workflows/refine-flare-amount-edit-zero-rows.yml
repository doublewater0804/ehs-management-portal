name: Refine FLARE amount editor zero rows

on:
  push:
    paths:
      - '.github/workflows/refine-flare-amount-edit-zero-rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Hide zero-flow rows by default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('FLARE/amount-edit.js')
          s = path.read_text(encoding='utf-8')

          old_css = """      #${MODAL_ID} tr:last-child td{border-bottom:0}\n      #${MODAL_ID} .fae-amount{width:160px;border:1px solid #b8c5d8;border-radius:8px;padding:8px 10px;text-align:right;font-size:14px;font-weight:800;color:#172033;background:#fff;outline:none}\n"""
          new_css = """      #${MODAL_ID} tr:last-child td{border-bottom:0}\n      #${MODAL_ID} .fae-zero-row{display:none}\n      #${MODAL_ID}.fae-show-zero .fae-zero-row{display:table-row}\n      #${MODAL_ID} .fae-zero-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:9px 11px;border:1px solid #dbe8fb;border-radius:8px;background:#f8fbff;color:#5b6b82;font-size:11.5px;line-height:1.5}\n      #${MODAL_ID} .fae-zero-toggle{flex:none;border:1px solid #b9cbea;border-radius:7px;background:#fff;color:#1d5fd0;padding:6px 9px;font-size:11.5px;font-weight:800;cursor:pointer}\n      #${MODAL_ID} .fae-zero-toggle:hover{background:#edf4ff;border-color:#8fb0e5}\n      #${MODAL_ID} .fae-amount{width:160px;border:1px solid #b8c5d8;border-radius:8px;padding:8px 10px;text-align:right;font-size:14px;font-weight:800;color:#172033;background:#fff;outline:none}\n"""
          if old_css not in s:
              raise SystemExit('amount editor CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_rows = """    const rows = events.map((event, index) => `\n      <tr>\n        <td>${index + 1}</td>\n        <td>${sourceLabel(event.source)}</td>\n        <td>${typeLabel(event.type)}</td>\n        <td><input class=\"fae-amount\" type=\"number\" min=\"0\" step=\"0.01\" inputmode=\"decimal\" value=\"${Number(event.amount || 0)}\" data-index=\"${index}\" aria-label=\"第 ${index + 1} 筆排放量\"></td>\n      </tr>`).join('');\n\n    modal.innerHTML = `\n"""
          new_rows = """    const zeroCount = events.filter((event) => Number(event.amount || 0) === 0).length;\n    const rows = events.map((event, index) => `\n      <tr${Number(event.amount || 0) === 0 ? ' class=\"fae-zero-row\"' : ''}>\n        <td>${index + 1}</td>\n        <td>${sourceLabel(event.source)}</td>\n        <td>${typeLabel(event.type)}</td>\n        <td><input class=\"fae-amount\" type=\"number\" min=\"0\" step=\"0.01\" inputmode=\"decimal\" value=\"${Number(event.amount || 0)}\" data-index=\"${index}\" aria-label=\"第 ${index + 1} 筆排放量\"></td>\n      </tr>`).join('');\n    const zeroTools = zeroCount > 0 ? `\n      <div class=\"fae-zero-tools\">\n        <span data-fae-zero-summary>另有 ${zeroCount} 筆 0 流量紀錄未顯示</span>\n        <button type=\"button\" class=\"fae-zero-toggle\" data-fae-zero-toggle>顯示全部原始紀錄</button>\n      </div>` : '';\n\n    modal.innerHTML = `\n"""
          if old_rows not in s:
              raise SystemExit('amount editor rows anchor not found')
          s = s.replace(old_rows, new_rows, 1)

          old_table = """          <div class=\"fae-table-wrap\">\n            <table>\n              <thead><tr><th>#</th><th>來源</th><th>類型</th><th>排放量 (NM3)</th></tr></thead>\n              <tbody>${rows}</tbody>\n            </table>\n          </div>\n          <div class=\"fae-total\">當日合計 <strong data-fae-total>${fmt(events.reduce((sum, event) => sum + Number(event.amount || 0), 0))}</strong> NM3</div>\n"""
          new_table = """          <div class=\"fae-table-wrap\">\n            <table>\n              <thead><tr><th>#</th><th>來源</th><th>類型</th><th>排放量 (NM3)</th></tr></thead>\n              <tbody>${rows}</tbody>\n            </table>\n          </div>\n          ${zeroTools}\n          <div class=\"fae-total\">當日合計 <strong data-fae-total>${fmt(events.reduce((sum, event) => sum + Number(event.amount || 0), 0))}</strong> NM3</div>\n"""
          if old_table not in s:
              raise SystemExit('amount editor table anchor not found')
          s = s.replace(old_table, new_table, 1)

          old_listener = """    modal.querySelectorAll('.fae-amount').forEach((input) => input.addEventListener('input', () => updateLiveTotal(modal)));\n    modal.querySelector('[data-fae-save]')?.addEventListener('click', () => saveChanges(modal, factory, dateISO, events));\n"""
          new_listener = """    modal.querySelectorAll('.fae-amount').forEach((input) => input.addEventListener('input', () => updateLiveTotal(modal)));\n    modal.querySelector('[data-fae-zero-toggle]')?.addEventListener('click', () => {\n      const showAll = !modal.classList.contains('fae-show-zero');\n      modal.classList.toggle('fae-show-zero', showAll);\n      const toggle = modal.querySelector('[data-fae-zero-toggle]');\n      const summary = modal.querySelector('[data-fae-zero-summary]');\n      if (toggle) toggle.textContent = showAll ? '隱藏 0 流量紀錄' : '顯示全部原始紀錄';\n      if (summary) summary.textContent = showAll\n        ? `已顯示全部原始紀錄，其中 ${zeroCount} 筆為 0 流量`\n        : `另有 ${zeroCount} 筆 0 流量紀錄未顯示`;\n    });\n    modal.querySelector('[data-fae-save]')?.addEventListener('click', () => saveChanges(modal, factory, dateISO, events));\n"""
          if old_listener not in s:
              raise SystemExit('amount editor listener anchor not found')
          s = s.replace(old_listener, new_listener, 1)

          old_focus = """    modal.querySelector('.fae-amount')?.focus();\n"""
          new_focus = """    const firstVisibleAmount = [...modal.querySelectorAll('.fae-amount')]\n      .find((input) => !input.closest('.fae-zero-row'));\n    firstVisibleAmount?.focus();\n"""
          if old_focus not in s:
              raise SystemExit('amount editor focus anchor not found')
          s = s.replace(old_focus, new_focus, 1)

          path.write_text(s, encoding='utf-8')

          auth = Path('firebase-mobile-auth.js')
          a = auth.read_text(encoding='utf-8')
          a = a.replace("./amount-edit.js?v=20260824-1110", "./amount-edit.js?v=20260825-1356", 1)
          auth.write_text(a, encoding='utf-8')

          index = Path('FLARE/index.html')
          i = index.read_text(encoding='utf-8')
          i = i.replace('../firebase-mobile-auth.js?v=20260824-1110', '../firebase-mobile-auth.js?v=20260825-1356', 1)
          index.write_text(i, encoding='utf-8')
          PY

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/amount-edit.js firebase-mobile-auth.js FLARE/index.html
          git rm .github/workflows/refine-flare-amount-edit-zero-rows.yml
          git commit -m 'refine: hide zero-flow rows in FLARE amount editor'
          git push origin main
