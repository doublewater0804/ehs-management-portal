name: Apply project progress types

on:
  push:
    branches:
      - project-progress-types-master-20260815
    paths:
      - .github/scripts/apply_project_progress_types.py
      - .github/workflows/apply-project-progress-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-progress-types-master-20260815
      - name: Apply patch
        run: |
          python3 .github/scripts/apply_project_progress_types.py
          grep -q "progressTypes" project/index.html
          grep -q "進度類型管理" project/index.html
          grep -q "typeId" project/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add project/index.html
          git commit -m 'feat: manage project progress types in master data [skip ci]'
          git push origin HEAD:project-progress-types-master-20260815
