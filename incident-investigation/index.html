<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事故調查輪值人員管理</title><link rel="stylesheet" href="style.css?v=20260915-v2"></head>
<body><header><div><a href="../index.html?v=20260915-v2#incident">← EHS 入口／意外事故調查</a><h1>事故調查輪值人員管理</h1><span>台灣 · 大陸 · 越南</span></div><div class="toolbar"><span id="account"></span><button id="login" disabled>Google 登入</button><button id="logout" hidden>登出</button></div></header>
<main><p id="status" role="status" aria-live="polite">正在連接登入服務…</p><div id="content" hidden>
<div class="toolbar controls"><nav aria-label="管理頁面"><button data-tab="overview" aria-pressed="true">輪值與調查紀錄</button><button data-tab="roster" aria-pressed="false">各地人員名冊</button><button data-tab="rules" aria-pressed="false">輪值規定與說明</button></nav><div class="toolbar"><button id="edit" class="primary" hidden>編輯資料</button><button id="import" hidden>匯入新增資料</button><button id="print">列印目前頁面</button></div></div>

<section id="overview" class="view"></section><section id="roster" class="view" hidden></section><section id="rules" class="view" hidden></section>
