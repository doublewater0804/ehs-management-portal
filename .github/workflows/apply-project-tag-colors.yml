name: Apply project tag colors

on:
  push:
    branches:
      - project-custom-tag-colors-20260814
    paths:
      - .github/scripts/apply_project_tag_colors.py
      - .github/workflows/apply-project-tag-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-custom-tag-colors-20260814
      - name: Apply patch
        run: |
          python3 .github/scripts/apply_project_tag_colors.py
          grep -q 'type="color"' project/index.html
          grep -q 'const tagStyle' project/index.html
          grep -q "color:'#1e3a5f'" project/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add project/index.html
          git commit -m 'feat: allow custom colors for project tags [skip ci]'
          git push origin HEAD:project-custom-tag-colors-20260814
