name: Fix routine Firebase init
on:
  push:
    branches: [fix-routine-firebase-init-20260814]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("routine-work/index.html"); s=p.read_text(encoding="utf-8"); old="async function setupFirebaseSync(){\\n  if(!window.__firebaseReady){\\n    updateCloudStatus(\\\"err\\\",\\\"Firebase SDK 未載入\\\");\\n    return;\\n  }\\n  try{\\n    cloudApi=await window.__firebaseReady;"; new="async function waitForFirebaseReady(timeoutMs=10000){\\n  const started=Date.now();\\n  while(!window.__firebaseReady){\\n    if(Date.now()-started>=timeoutMs) throw new Error(\\\"Firebase SDK 載入逾時\\\");\\n    await new Promise(resolve=>setTimeout(resolve,50));\\n  }\\n  return window.__firebaseReady;\\n}\\nasync function setupFirebaseSync(){\\n  try{\\n    updateCloudStatus(\\\"warn\\\",\\\"Firebase 載入中\\\");\\n    cloudApi=await waitForFirebaseReady();"; assert old in s; s=s.replace(old,new,1); old2="async function cloudSignIn(){\\n  try{\\n    if(!cloudApi) cloudApi=await window.__firebaseReady;\\n    await cloudApi.signIn();"; new2="async function cloudSignIn(){\\n  try{\\n    if(!cloudApi) cloudApi=await waitForFirebaseReady();\\n    await cloudApi.signIn();"; assert old2 in s; s=s.replace(old2,new2,1); p.write_text(s,encoding="utf-8")'
          grep -q 'waitForFirebaseReady' routine-work/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add routine-work/index.html
          git commit -m 'fix: wait for Firebase module before routine-work sync [skip ci]'
          git push
