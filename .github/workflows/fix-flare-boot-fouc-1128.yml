name: Fix FLARE boot FOUC 1128

on:
  push:
    paths:
      - '.github/workflows/fix-flare-boot-fouc-1128.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch FLARE initial render and cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260826-1128'

          # 1) FLARE/index.html: hide legacy shell before first paint; only auth/loading remains visible.
          index = Path('FLARE/index.html')
          s = index.read_text(encoding='utf-8')
          guard = '''\n<style id="flare-boot-guard">\nhtml.flare-ui-booting .app-shell{visibility:hidden!important}\nhtml.flare-ui-booting body{background:#f4f7fb!important}\nhtml.flare-ui-booting body::before{content:"廠區廢氣燃燒塔管制表載入中…";position:fixed;inset:0;display:grid;place-items:center;color:#526175;font:700 14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;letter-spacing:.02em;z-index:1;background:#f4f7fb}\n</style>\n<script>document.documentElement.classList.add('flare-ui-booting');</script>'''
          if 'id="flare-boot-guard"' not in s:
              marker = '<meta content="width=device-width, initial-scale=1.0" name="viewport"/>'
              if marker not in s:
                  raise SystemExit('viewport marker not found in FLARE/index.html')
              s = s.replace(marker, marker + guard, 1)
          s, n = re.subn(r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";',
                          f'from "../firebase-mobile-auth.js?v={version}";', s, count=1)
          if n != 1:
              raise SystemExit('FLARE auth import not found')
          index.write_text(s, encoding='utf-8')

          # 2) layout-redesign.js: reveal app only after the new layout has completed.
          layout = Path('FLARE/layout-redesign.js')
          s = layout.read_text(encoding='utf-8')
          old = '''  function applyLayout() {\n    if (isInputView) configureInputView();\n    else configureReportView();\n  }'''
          new = '''  function revealFlareUi() {\n    root.classList.remove('flare-ui-booting');\n    root.classList.add('flare-ui-ready');\n  }\n\n  function applyLayout() {\n    try {\n      if (isInputView) configureInputView();\n      else configureReportView();\n    } finally {\n      requestAnimationFrame(revealFlareUi);\n    }\n  }'''
          if old not in s:
              raise SystemExit('applyLayout block not found')
          s = s.replace(old, new, 1)
          layout.write_text(s, encoding='utf-8')

          # 3) firebase-mobile-auth.js: force fresh layout script.
          auth = Path('firebase-mobile-auth.js')
          s = auth.read_text(encoding='utf-8')
          s, n = re.subn(r"flareLayoutRedesign\.src = '\./layout-redesign\.js(?:\?v=[^']+)?';",
                          f"flareLayoutRedesign.src = './layout-redesign.js?v={version}';", s, count=1)
          if n != 1:
              raise SystemExit('layout-redesign loader not found')
          auth.write_text(s, encoding='utf-8')

          # 4) Portal link: use a versioned FLARE URL to avoid cached HTML on entry.
          portal = Path('index.html')
          s = portal.read_text(encoding='utf-8')
          s, n = re.subn(r"href:\s*'\./FLARE/index\.html(?:\?v=[^']+)?'",
                          f"href: './FLARE/index.html?v={version}'", s, count=1)
          if n != 1:
              raise SystemExit('portal FLARE href not found')
          portal.write_text(s, encoding='utf-8')
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html FLARE/layout-redesign.js firebase-mobile-auth.js index.html
          git rm .github/workflows/fix-flare-boot-fouc-1128.yml
          git commit -m 'fix: prevent FLARE legacy UI flash before login'
          git push origin main
