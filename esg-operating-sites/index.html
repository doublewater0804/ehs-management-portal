<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台化營運據點管理系統</title><link rel="stylesheet" href="style.css?v=r01"><link rel="stylesheet" href="../ehs-home-button.css?v=20261118-r1"></head><body>
<header><div><small>ESG ／ 基礎資料管理</small><h1>台化營運據點管理系統 <span>R0.1</span></h1></div><div class="toolbar"><span id="account"></span><button id="login">Google 登入</button><button id="logout" hidden>登出</button><a id="ehs-portal-home-button" href="../" target="_self"><span class="ehs-home-icon" aria-hidden="true">🏠</span><span>EHS 首頁</span></a></div></header>
<main><p id="status" role="status" aria-live="polite">正在連接 Firebase…</p><div id="content" hidden><div id="kpis" class="kpis"></div><section class="panel"><nav id="tabs" class="toolbar"><button data-tab="list" aria-pressed="true">營運據點清單</button><button data-tab="stats">統計分析</button><button data-tab="settings">基本資料管理</button><button data-tab="history">異動紀錄</button><button data-tab="trash">回收區</button></nav><div id="view"></div></section><section class="panel" id="notes-panel"><h2>備註管理 <small id="note-time"></small></h2><textarea id="notes" rows="5" placeholder="輸入營運據點管理事項及補充說明"></textarea><div class="toolbar"><button id="note-save" class="primary">儲存備註</button><button id="note-cancel">取消修改</button></div></section></div></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">編輯據點</h2><button type="button" id="edit-close">關閉</button></div><div id="edit-fields" class="formgrid"></div><div class="toolbar"><button type="submit" class="primary">儲存至雲端</button><button type="button" id="edit-cancel">取消</button></div></form></dialog><dialog id="import-dialog"><div class="dialog-head"><h2>Excel 匯入差異預覽</h2><button id="import-close">取消</button></div><p>請確認每筆新增或修改。疑似相同據點須手動選擇；未列出的舊資料不刪除。</p><div id="import-preview"></div><button id="import-confirm" class="primary">確認匯入勾選資料</button></dialog><dialog id="detail"><div class="dialog-head"><h2>異動內容</h2><button id="detail-close">關閉</button></div><div id="detail-body"></div></dialog>
<div id="print-root"></div><footer>清單紀錄不等同實體營運據點數量 · 台灣時間 UTC+8</footer><script type="module">import('./app.js?v=r01').catch(e=>{document.getElementById('status').textContent='程式載入失敗：'+e.message;});</script></body></html>
