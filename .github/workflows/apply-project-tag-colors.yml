name: Apply project tag colors

on:
  push:
    branches: [project-custom-tag-colors-20260814]
    paths: [.github/workflows/apply-project-tag-colors.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-custom-tag-colors-20260814
      - name: Patch customizable tag colors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('project/index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: target not found')
              s=s.replace(old,new,1)

          once("""      factories: [
        { id:'LD', label:'龍德', active:true, order:1 },
        { id:'CH', label:'彰化', active:true, order:2 },
        { id:'ML', label:'麥寮', active:true, order:3 },
        { id:'SG', label:'新港', active:true, order:4 },
        { id:'CROSS', label:'跨廠區', active:true, order:5 }
      ],
      projectTypes: [
        { id:'ENGINEERING', label:'專案工程', active:true, order:1, tone:'blue' },
        { id:'PERMIT', label:'法規/證照申請', active:true, order:2, tone:'purple' },
        { id:'FIRE_SAFETY', label:'年度工作', active:true, order:3, tone:'red' },
        { id:'IMPROVEMENT', label:'稽核缺失改善', active:true, order:4, tone:'orange' },
        { id:'OTHER', label:'其他 (自行輸入)', active:true, order:5, tone:'gray' }
      ],
      permitCategories: [
        { id:'AIR', label:'空污', active:true, order:1 },
        { id:'WATER', label:'廢水', active:true, order:2 },
        { id:'WASTE', label:'廢棄物', active:true, order:3 }
      ]""",
          """      factories: [
        { id:'LD', label:'龍德', active:true, order:1, color:'#1e3a5f' },
        { id:'CH', label:'彰化', active:true, order:2, color:'#0f766e' },
        { id:'ML', label:'麥寮', active:true, order:3, color:'#c2410c' },
        { id:'SG', label:'新港', active:true, order:4, color:'#7c3aed' },
        { id:'CROSS', label:'跨廠區', active:true, order:5, color:'#475569' }
      ],
      projectTypes: [
        { id:'ENGINEERING', label:'專案工程', active:true, order:1, tone:'blue', color:'#2563eb' },
        { id:'PERMIT', label:'法規/證照申請', active:true, order:2, tone:'purple', color:'#9333ea' },
        { id:'FIRE_SAFETY', label:'年度工作', active:true, order:3, tone:'red', color:'#dc2626' },
        { id:'IMPROVEMENT', label:'稽核缺失改善', active:true, order:4, tone:'orange', color:'#ea580c' },
        { id:'OTHER', label:'其他 (自行輸入)', active:true, order:5, tone:'gray', color:'#64748b' }
      ],
      permitCategories: [
        { id:'AIR', label:'空污', active:true, order:1, color:'#64748b' },
        { id:'WATER', label:'廢水', active:true, order:2, color:'#0284c7' },
        { id:'WASTE', label:'廢棄物', active:true, order:3, color:'#b45309' }
      ]""",'default colors')

          once("""    const normalizeItems = (items, fallback) => {
      const list = Array.isArray(items) && items.length ? items : deepClone(fallback);
      return list.map((x,i) => ({ ...x, id:String(x.id || uid('item')), label:String(x.label || '').trim(), active:x.active !== false, order:Number.isFinite(Number(x.order)) ? Number(x.order) : i + 1 })).sort((a,b) => a.order - b.order);
    };
    const typeTone = (tone='gray') => ({
      blue:'bg-blue-100 text-blue-800', purple:'bg-purple-100 text-purple-800', red:'bg-red-100 text-red-800', orange:'bg-orange-100 text-orange-800', green:'bg-green-100 text-green-800', gray:'bg-gray-100 text-gray-800'
    }[tone] || 'bg-gray-100 text-gray-800');
    const typeBar = (tone='gray') => ({ blue:'bg-blue-500', purple:'bg-purple-500', red:'bg-red-500', orange:'bg-orange-500', green:'bg-green-500', gray:'bg-gray-500' }[tone] || 'bg-gray-500');""",
          """    const normalizeHexColor = (value, fallback='#64748b') => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value) : fallback;
    const toneHex = (tone='gray') => ({blue:'#2563eb',purple:'#9333ea',red:'#dc2626',orange:'#ea580c',green:'#16a34a',gray:'#64748b'}[tone] || '#64748b');
    const normalizeItems = (items, fallback) => {
      const list = Array.isArray(items) && items.length ? items : deepClone(fallback);
      return list.map((x,i) => {
        const fb = fallback.find(f => String(f.id) === String(x.id)) || fallback[i] || {};
        const fallbackColor = fb.color || toneHex(x.tone || fb.tone);
        return { ...x, id:String(x.id || uid('item')), label:String(x.label || '').trim(), active:x.active !== false, order:Number.isFinite(Number(x.order)) ? Number(x.order) : i + 1, color:normalizeHexColor(x.color, fallbackColor) };
      }).sort((a,b) => a.order - b.order);
    };
    const hexToRgba = (hex, alpha=.14) => {
      const h=normalizeHexColor(hex).slice(1); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
      return `rgba(${r},${g},${b},${alpha})`;
    };
    const darkenHex = (hex, amount=.28) => {
      const h=normalizeHexColor(hex).slice(1); const vals=[0,2,4].map(i=>Math.max(0,Math.round(parseInt(h.slice(i,i+2),16)*(1-amount))));
      return `#${vals.map(v=>v.toString(16).padStart(2,'0')).join('')}`;
    };
    const contrastText = (hex) => {
      const h=normalizeHexColor(hex).slice(1); const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
      return (r*299+g*587+b*114)/1000 > 165 ? '#0f172a' : '#ffffff';
    };
    const tagStyle = (color, solid=false) => {
      const c=normalizeHexColor(color);
      return solid ? {backgroundColor:c,color:contrastText(c),borderColor:c} : {backgroundColor:hexToRgba(c,.12),color:darkenHex(c,.22),borderColor:hexToRgba(c,.32)};
    };""",'color helpers')

          once("""        const base = { id:`${prefix}_${Date.now().toString(36).toUpperCase()}`, label:'', active:true, order:arr.length + 1 };
        if (key === 'projectTypes') base.tone = 'gray';""",
          """        const defaultColor = key === 'factories' ? '#475569' : key === 'projectTypes' ? '#64748b' : '#64748b';
        const base = { id:`${prefix}_${Date.now().toString(36).toUpperCase()}`, label:'', active:true, order:arr.length + 1, color:defaultColor };
        if (key === 'projectTypes') base.tone = 'gray';""",'new item color')

          once("""                    {projectTypes.map(t => <div key={t.id} className=\"flex items-center gap-1.5 px-2 py-0.5 border-r last:border-0 border-gray-200\"><span className={`w-2 h-2 rounded-full ${typeBar(t.tone)}`}></span><span className=\"text-[11px] font-bold text-gray-600\">{t.label}:</span><span className=\"text-[11px] font-mono font-bold text-blue-600\">{projectCounts[t.id] || 0}</span></div>)}""",
          """                    {projectTypes.map(t => <div key={t.id} className=\"flex items-center gap-1.5 px-2 py-0.5 border-r last:border-0 border-gray-200\"><span className=\"w-2 h-2 rounded-full\" style={{backgroundColor:t.color}}></span><span className=\"text-[11px] font-bold text-gray-600\">{t.label}:</span><span className=\"text-[11px] font-mono font-bold text-blue-600\">{projectCounts[t.id] || 0}</span></div>)}""",'summary dot')

          once("""              {projectTypes.map(t => <button key={t.id} onClick={() => setFilterType(t.id)} className={`px-4 py-2 rounded-full text-sm font-bold ${filterType === t.id ? `${typeBar(t.tone)} text-white shadow` : 'bg-white text-gray-600 border border-gray-200'}`}>{t.label}</button>)}""",
          """              {projectTypes.map(t => <button key={t.id} onClick={() => setFilterType(t.id)} style={filterType === t.id ? tagStyle(t.color,true) : undefined} className={`px-4 py-2 rounded-full text-sm font-bold ${filterType === t.id ? 'shadow border' : 'bg-white text-gray-600 border border-gray-200'}`}>{t.label}</button>)}""",'filter button')

          once("""                    const t = typeMap[p.type] || { label:p.type || '未分類', tone:'gray' }; const f = factoryMap[p.factory];""",
          """                    const t = typeMap[p.type] || { label:p.type || '未分類', color:'#64748b' }; const f = factoryMap[p.factory];""",'fallback type')

          once("""                          <span className=\"text-[10px] px-2 py-0.5 rounded font-bold bg-slate-800 text-white\">{f?.label || '未設定廠區'}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${typeTone(t.tone)}`}>{p.type === 'OTHER' && p.customTypeName ? p.customTypeName : t.label}</span>
                          {p.type === 'PERMIT' && (p.permitCategories || []).map(id => <span key={id} className=\"text-[10px] px-2 py-0.5 rounded font-bold bg-purple-50 text-purple-700 border border-purple-100\">{permitMap[id]?.label || id}</span>)}""",
          """                          <span style={tagStyle(f?.color || '#475569',true)} className=\"text-[10px] px-2 py-0.5 rounded font-bold border\">{f?.label || '未設定廠區'}</span>
                          <span style={tagStyle(t.color)} className=\"text-[10px] px-2 py-0.5 rounded font-bold border\">{p.type === 'OTHER' && p.customTypeName ? p.customTypeName : t.label}</span>
                          {p.type === 'PERMIT' && (p.permitCategories || []).map(id => {const c=permitMap[id]; return <span key={id} style={tagStyle(c?.color || '#64748b')} className=\"text-[10px] px-2 py-0.5 rounded font-bold border\">{c?.label || id}</span>;})}""",'row tags')

          once("""                  {selectedType === 'PERMIT' && <div className=\"md:col-span-2 bg-purple-50/60 border border-purple-100 rounded-xl p-4\"><label className=\"block text-sm font-bold text-purple-800 mb-3\">法規類別（可複選）*</label><div className=\"flex flex-wrap gap-2\">{permitCategories.filter(x => x.active || selectedPermitCategories.includes(x.id)).map(c => <label key={c.id} className={`flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer ${selectedPermitCategories.includes(c.id) ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-purple-700 border-purple-200'}`}><input type=\"checkbox\" checked={selectedPermitCategories.includes(c.id)} onChange={() => togglePermitCategory(c.id)} className=\"accent-purple-600\"/><span className=\"text-sm font-bold\">{c.label}{c.active ? '' : '（已停用）'}</span></label>)}</div></div>}""",
          """                  {selectedType === 'PERMIT' && <div className=\"md:col-span-2 bg-slate-50 border border-slate-200 rounded-xl p-4\"><label className=\"block text-sm font-bold text-slate-700 mb-3\">法規類別（可複選）*</label><div className=\"flex flex-wrap gap-2\">{permitCategories.filter(x => x.active || selectedPermitCategories.includes(x.id)).map(c => {const checked=selectedPermitCategories.includes(c.id); return <label key={c.id} style={checked ? tagStyle(c.color,true) : tagStyle(c.color,false)} className=\"flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer\"><input type=\"checkbox\" checked={checked} onChange={() => togglePermitCategory(c.id)} style={{accentColor:c.color}}/><span className=\"text-sm font-bold\">{c.label}{c.active ? '' : '（已停用）'}</span></label>;})}</div></div>}""",'permit selector colors')

          once("""            <div className=\"flex-1 p-5 overflow-y-auto\"><div className=\"flex justify-between items-center mb-4\"><div><h4 className=\"font-bold text-slate-800\">{masterLabels[masterTab]}</h4><p className=\"text-xs text-slate-400 mt-1\">可直接修改名稱、停用，並用上下箭頭調整排序。</p></div><button onClick={() => addMasterItem(masterTab)} className=\"px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg flex items-center gap-1\"><Plus className=\"w-3 h-3\"/> 新增</button></div>
              <div className=\"space-y-2\">{currentMasterItems.map((item,idx) => <div key={item.id} className=\"bg-white border border-slate-200 rounded-xl p-3 flex flex-col md:flex-row gap-3 items-center\"><div className=\"text-xs font-mono text-slate-400 w-full md:w-24 truncate\" title={item.id}>{item.id}</div><input value={item.label} onChange={e => updateMasterItem(masterTab,item.id,{label:e.target.value})} className=\"flex-1 p-2 border rounded-lg\" placeholder=\"名稱\"/><label className=\"flex items-center gap-2 text-xs font-bold text-slate-600\"><input type=\"checkbox\" checked={item.active !== false} onChange={e => updateMasterItem(masterTab,item.id,{active:e.target.checked})}/>啟用</label><div className=\"flex gap-1\"><button type=\"button\" disabled={idx===0} onClick={() => moveMasterItem(masterTab,item.id,-1)} className=\"px-2 py-1 border rounded disabled:opacity-30\">↑</button><button type=\"button\" disabled={idx===currentMasterItems.length-1} onClick={() => moveMasterItem(masterTab,item.id,1)} className=\"px-2 py-1 border rounded disabled:opacity-30\">↓</button></div></div>)}</div>""",
          """            <div className=\"flex-1 p-5 overflow-y-auto\"><div className=\"flex justify-between items-center mb-4\"><div><h4 className=\"font-bold text-slate-800\">{masterLabels[masterTab]}</h4><p className=\"text-xs text-slate-400 mt-1\">可修改名稱、顏色、啟用狀態，並用上下箭頭調整排序。</p></div><button onClick={() => addMasterItem(masterTab)} className=\"px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg flex items-center gap-1\"><Plus className=\"w-3 h-3\"/> 新增</button></div>
              <div className=\"space-y-2\">{currentMasterItems.map((item,idx) => <div key={item.id} className=\"bg-white border border-slate-200 rounded-xl p-3 flex flex-col md:flex-row gap-3 items-center\"><div className=\"text-xs font-mono text-slate-400 w-full md:w-24 truncate\" title={item.id}>{item.id}</div><input value={item.label} onChange={e => updateMasterItem(masterTab,item.id,{label:e.target.value})} className=\"flex-1 p-2 border rounded-lg\" placeholder=\"名稱\"/><div className=\"flex items-center gap-2 shrink-0\"><span style={masterTab === 'factories' ? tagStyle(item.color,true) : tagStyle(item.color)} className=\"px-2 py-1 rounded border text-xs font-bold min-w-14 text-center\">{item.label || '預覽'}</span><input type=\"color\" value={normalizeHexColor(item.color)} onChange={e => updateMasterItem(masterTab,item.id,{color:e.target.value})} className=\"w-10 h-9 p-1 border rounded-lg cursor-pointer bg-white\" title=\"自訂標籤顏色\"/></div><label className=\"flex items-center gap-2 text-xs font-bold text-slate-600\"><input type=\"checkbox\" checked={item.active !== false} onChange={e => updateMasterItem(masterTab,item.id,{active:e.target.checked})}/>啟用</label><div className=\"flex gap-1\"><button type=\"button\" disabled={idx===0} onClick={() => moveMasterItem(masterTab,item.id,-1)} className=\"px-2 py-1 border rounded disabled:opacity-30\">↑</button><button type=\"button\" disabled={idx===currentMasterItems.length-1} onClick={() => moveMasterItem(masterTab,item.id,1)} className=\"px-2 py-1 border rounded disabled:opacity-30\">↓</button></div></div>)}</div>""",'master color UI')

          p.write_text(s,encoding='utf-8')
          PY
          grep -q "type=\"color\"" project/index.html
          grep -q "const tagStyle" project/index.html
          grep -q "color:'#1e3a5f'" project/index.html
          grep -q "style={tagStyle(f?.color" project/index.html
          git config user.name 'openai-automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add project/index.html
          git commit -m 'feat: allow custom colors for project tags [skip ci]'
          git push origin HEAD:project-custom-tag-colors-20260814
