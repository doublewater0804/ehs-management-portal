name: Finalize FLARE recovery 1015

on:
  push:
    paths:
      - '.github/workflows/finalize-flare-recovery-1015.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch FLARE core sync and recovery loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('FLARE/index.html')
          s = index.read_text(encoding='utf-8')

          old = '''    let firstSnapshot = true;
    window.__flareCloudPush = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() }, { merge: true });
    };
    window.__flareCloudUploadLocal = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() }, { merge: true });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") {
          window.__applyFlareCloudState(data.state);
        }
      } else if (firstSnapshot) {
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });'''

          new = '''    let firstSnapshot = true;
    window.__flareCloudHydrated = false;
    window.__flareCloudHydrationFailed = false;

    // Firestore state 是完整快照；禁止巢狀 merge，避免已移除 key 或舊 localStorage 狀態殘留。
    window.__flareCloudPush = async (state) => {
      if (window.__flareCloudHydrated !== true) {
        throw new Error("Firestore 初始資料尚未載入完成，已阻止本機覆蓋雲端。");
      }
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() });
    };
    window.__flareCloudUploadLocal = async (state) => {
      if (window.__flareCloudHydrated !== true) {
        throw new Error("Firestore 初始資料尚未載入完成，暫時禁止本機覆蓋雲端。");
      }
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") {
          window.__applyFlareCloudState(data.state);
        }
        window.__flareCloudHydrated = true;
        window.__flareCloudHydrationFailed = false;
      } else if (firstSnapshot) {
        window.__flareCloudHydrated = true;
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      window.__flareCloudHydrated = false;
      window.__flareCloudHydrationFailed = true;
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });'''

          if old in s:
              s = s.replace(old, new, 1)

          old_q = '''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);'''
          new_q = '''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (window.__flareCloudHydrated !== true) {
                setFirebaseSyncStatus(window.__flareCloudHydrationFailed
                    ? '☁️ 雲端同步失敗，已阻止本機覆蓋雲端'
                    : '☁️ 等待雲端初始同步，暫不寫入', window.__flareCloudHydrationFailed ? 'err' : 'warn');
                return;
            }
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);'''
          if old_q in s:
              s = s.replace(old_q, new_q, 1)

          old_load = '''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            saveData();
            renderAll();'''
          new_load = '''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            // 首次載入只讀 Firestore；不得自動把 localStorage 反向覆蓋雲端。
            renderAll();'''
          if old_load in s:
              s = s.replace(old_load, new_load, 1)

          s, n = re.subn(r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";',
                          'from "../firebase-mobile-auth.js?v=20260824-1015";', s, count=1)
          if n != 1:
              raise SystemExit('FLARE auth import not found')
          index.write_text(s, encoding='utf-8')

          auth = Path('firebase-mobile-auth.js')
          s = auth.read_text(encoding='utf-8')
          s, n = re.subn(r"flareRestoreActions\.src = '\./restore-actions\.js(?:\?v=[^']+)?';",
                          "flareRestoreActions.src = './restore-actions.js?v=20260824-1015';", s, count=1)
          if n != 1:
              raise SystemExit('restore-actions loader not found')
          auth.write_text(s, encoding='utf-8')

          restore = Path('FLARE/restore-actions.js')
          s = restore.read_text(encoding='utf-8')
          s = re.sub(r"guard\.src = '\./sync-guard\.js(?:\?v=[^']+)?';",
                     "guard.src = './sync-guard.js?v=20260824-1015';", s, count=1)
          recovery_loader = '''\n  if (!document.querySelector('script[data-flare-exclusion-recovery-20260824]')) {\n    const recovery = document.createElement('script');\n    recovery.src = './recover-exclusions-20260824.js?v=20260824-1015';\n    recovery.defer = true;\n    recovery.dataset.flareExclusionRecovery20260824 = '1';\n    document.head.appendChild(recovery);\n  }\n'''
          marker = "  document.addEventListener('click', async (event) => {"
          if 'data-flare-exclusion-recovery-20260824' not in s:
              if marker not in s:
                  raise SystemExit('restore click marker not found')
              s = s.replace(marker, recovery_loader + '\n' + marker, 1)
          restore.write_text(s, encoding='utf-8')
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html firebase-mobile-auth.js FLARE/restore-actions.js
          git rm .github/workflows/finalize-flare-recovery-1015.yml
          git commit -m 'fix: finalize FLARE sync and recover two exclusions'
          git push origin main
