name: Finalize FLARE sync 1010

on:
  push:
    paths:
      - '.github/workflows/finalize-flare-sync-1010.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch FLARE core and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('FLARE/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''    let firstSnapshot = true;
    window.__flareCloudPush = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() }, { merge: true });
    };
    window.__flareCloudUploadLocal = async (state) => {
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() }, { merge: true });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") {
          window.__applyFlareCloudState(data.state);
        }
      } else if (firstSnapshot) {
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });''', '''    let firstSnapshot = true;
    window.__flareCloudHydrated = false;
    window.__flareCloudHydrationFailed = false;

    window.__flareCloudPush = async (state) => {
      if (window.__flareCloudHydrated !== true) throw new Error("Firestore 初始資料尚未載入完成，已阻止本機覆蓋雲端。");
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp() });
    };
    window.__flareCloudUploadLocal = async (state) => {
      if (window.__flareCloudHydrated !== true) throw new Error("Firestore 初始資料尚未載入完成，暫時禁止本機覆蓋雲端。");
      await setDoc(FLARE_DOC, { state, updatedAt: serverTimestamp(), migratedAt: serverTimestamp() });
    };

    onSnapshot(FLARE_DOC, (snap) => {
      if (snap.exists()) {
        const data = snap.data() || {};
        if (data.state && typeof window.__applyFlareCloudState === "function") window.__applyFlareCloudState(data.state);
        window.__flareCloudHydrated = true;
        window.__flareCloudHydrationFailed = false;
      } else if (firstSnapshot) {
        window.__flareCloudHydrated = true;
        updateStatus("☁️ 雲端尚無資料，可按本機資料上傳雲端", "warn");
      }
      firstSnapshot = false;
    }, (err) => {
      console.error(err);
      window.__flareCloudHydrated = false;
      window.__flareCloudHydrationFailed = true;
      updateStatus("☁️ " + firebaseErrorText(err, "Firebase 同步失敗"), "err");
    });''', 1)

          s = s.replace('''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);''', '''        function queueFlareCloudSave() {
            if (__flareApplyingRemote) return;
            if (window.__flareCloudHydrated !== true) {
                setFirebaseSyncStatus(window.__flareCloudHydrationFailed
                    ? '☁️ 雲端同步失敗，已阻止本機覆蓋雲端'
                    : '☁️ 等待雲端初始同步，暫不寫入', window.__flareCloudHydrationFailed ? 'err' : 'warn');
                return;
            }
            if (typeof window.__flareCloudPush !== 'function') return;
            clearTimeout(__flareCloudSaveTimer);''', 1)

          s = s.replace('''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            saveData();
            renderAll();''', '''            bindFactoryAliasManagementEvents();
            renderFactoryAliasManager();
            renderAll();''', 1)

          s, n = re.subn(r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";', 'from "../firebase-mobile-auth.js?v=20260824-1010";', s, count=1)
          if n != 1: raise SystemExit('auth import not found')
          p.write_text(s, encoding='utf-8')

          a = Path('firebase-mobile-auth.js')
          s = a.read_text(encoding='utf-8')
          s, n = re.subn(r"flareRestoreActions\.src = '\./restore-actions\.js(?:\?v=[^']+)?';", "flareRestoreActions.src = './restore-actions.js?v=20260824-1010';", s, count=1)
          if n != 1: raise SystemExit('restore loader not found')
          a.write_text(s, encoding='utf-8')

          r = Path('FLARE/restore-actions.js')
          s = r.read_text(encoding='utf-8').replace('./sync-guard.js?v=20260824-1006', './sync-guard.js?v=20260824-1010')
          r.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html firebase-mobile-auth.js FLARE/restore-actions.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finalize FLARE cloud-first sync protection'
          git push origin main
