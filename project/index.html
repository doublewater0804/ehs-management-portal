  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { requireFirebaseUser, firebaseErrorText } from "../firebase-mobile-auth.js?v=15";
    import {
      initializeFirestore,
      collection,
      doc,
      addDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = window.__FIREBASE_CONFIG;

    window.__firebaseReady = (async () => {
      if (!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.projectId) throw new Error("Firebase config missing");

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
      const appId = (window.__APP_ID && String(window.__APP_ID).trim()) ? window.__APP_ID : "ehs-dashboard-2024";
      const PROJECTS_COL = collection(db, `${appId}_projects`);
      const MASTER_COL = collection(db, `${appId}_project_masterdata`);
      const provider = new GoogleAuthProvider();

      window.__fb = { app, auth, db, PROJECTS_COL, MASTER_COL };

      const user = await requireFirebaseUser({
        auth,
        provider,
        signInWithPopup,
        onAuthStateChanged,
        signOut,
        setPersistence,
        browserLocalPersistence,
        moduleName: "年度安衛環專案管制總表"
      });

      window.__currentUserName = user?.displayName || (user?.email ? user.email.split('@')[0] : '') || '';

      window.__fs_add = async (payload) => {
        const now = serverTimestamp();
        const docRef = await addDoc(PROJECTS_COL, { ...payload, createdAt: now, updatedAt: now });
        return docRef.id;
      };

      window.__fs_update = async (id, payload) => {
        await updateDoc(doc(PROJECTS_COL, String(id)), { ...payload, updatedAt: serverTimestamp() });
      };

      window.__fs_delete = async (id) => {
        await deleteDoc(doc(PROJECTS_COL, String(id)));
      };

      window.__fs_subscribe = (cb, onErr) => {
        const q = query(PROJECTS_COL, orderBy("createdAt", "desc"));
        return onSnapshot(q, (snap) => {
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...(d.data() || {}) }));
          cb(list);
        }, onErr);
      };

      window.__fs_subscribe_master = (cb, onErr) => {
        return onSnapshot(MASTER_COL, (snap) => {
          const data = {};
          snap.forEach(d => { data[d.id] = Array.isArray(d.data()?.items) ? d.data().items : []; });
          cb(data);
        }, onErr);
      };

      window.__fs_save_master = async (key, items) => {
        await setDoc(doc(MASTER_COL, key), { items, updatedAt: serverTimestamp() }, { merge: true });
      };

      return true;
    })();
  </script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const IconBase = ({ children, className = '', ...props }) => (

    const FileSpreadsheet = (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/></IconBase>;
    const Settings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 8.97 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.09A1.7 1.7 0 0 0 4.65 8.94a1.7 1.7 0 0 0-.34-1.88L4.25 7l2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.57 1.7 1.7 0 0 0 10.03 3H10V3h4v.09A1.7 1.7 0 0 0 15.03 4.65a1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7.08l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.03H21v4h-.09A1.7 1.7 0 0 0 19.4 15z"/></IconBase>;
    const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>;

    const DEFAULT_MASTER = Object.freeze({
      factories: [
        { id:'LD', label:'龍德', active:true, order:1, color:'#1e3a5f' },
        { id:'CH', label:'彰化', active:true, order:2, color:'#0f766e' },
        { id:'ML', label:'麥寮', active:true, order:3, color:'#c2410c' },
        { id:'SG', label:'新港', active:true, order:4, color:'#7c3aed' },

      ],
      projectTypes: [
        { id:'ENGINEERING', label:'專案工程', active:true, order:1, tone:'blue', color:'#2563eb' },
        { id:'PERMIT', label:'法規/證照申請', active:true, order:2, tone:'purple', color:'#9333ea' },
        { id:'FIRE_SAFETY', label:'年度工作', active:true, order:3, tone:'red', color:'#dc2626' },
        { id:'IMPROVEMENT', label:'稽核缺失改善', active:true, order:4, tone:'orange', color:'#ea580c' },
        { id:'OTHER', label:'其他 (自行輸入)', active:true, order:5, tone:'gray', color:'#64748b' }
      ],
      permitCategories: [
        { id:'AIR', label:'空污', active:true, order:1, color:'#64748b' },
        { id:'WATER', label:'廢水', active:true, order:2, color:'#0284c7' },
        { id:'WASTE', label:'廢棄物', active:true, order:3, color:'#b45309' }
      ],
      progressTypes: [
        { id:'WORK_LOG', label:'工作日報', active:true, order:1, color:'#2563eb' },
        { id:'PHONE', label:'電話確認', active:true, order:2, color:'#0f766e' },
        { id:'NOTES', label:'Notes', active:true, order:3, color:'#64748b' },
        { id:'DOCUMENT', label:'公文', active:true, order:4, color:'#7c3aed' },
        { id:'MEETING', label:'會議', active:true, order:5, color:'#9333ea' },
        { id:'ONSITE', label:'現場確認', active:true, order:6, color:'#ea580c' },
        { id:'TODO', label:'待辦事項', active:true, order:7, color:'#d97706' },
        { id:'SUPERVISOR', label:'主管指示', active:true, order:8, color:'#dc2626' },
        { id:'OTHER', label:'其他', active:true, order:9, color:'#475569' }
      ],
      people: [],
      years: []
    });
    const STATUS_TYPES = {
      NOT_STARTED:{label:'未開始', color:'text-slate-600', bgColor:'bg-slate-400'},
      IN_PROGRESS:{label:'辦理中', color:'text-blue-700', bgColor:'bg-blue-500'},
      PENDING:{label:'待確認', color:'text-amber-700', bgColor:'bg-amber-500'},
      PAUSED:{label:'暫停', color:'text-purple-700', bgColor:'bg-purple-500'},
      COMPLETED:{label:'已結案', color:'text-gray-600', bgColor:'bg-gray-400'}
    };
    const LEGACY_STATUS = {ON_TRACK:'正常', DELAYED:'落後', COMPLETED:'結案'};
    const exactYear = (v) => { const str=String(v||''); if(!/^\d{4}-\d{2}-\d{2}$/.test(str))return null; const d=new Date(`${str}T00:00:00`); return !Number.isNaN(d.getTime()) && `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===str ? d.getFullYear():null; };
    const getProjectYear = p => exactYear(p.startDate);
    const isCompleted = p => p.executionStatus ? p.executionStatus === 'COMPLETED' : p.status === 'COMPLETED';
    const statusLabel = p => p.executionStatus && STATUS_TYPES[p.executionStatus] ? STATUS_TYPES[p.executionStatus].label : `舊：${LEGACY_STATUS[p.status] || p.status || '未設定'}（待確認）`;
    const todoList = p => Array.isArray(p.todos) ? p.todos : [];
    const todoAlert = (date, done=false) => {
      if (done || !exactYear(date)) return '';
      const delta = Math.round((new Date(`${date}T00:00:00`) - new Date(`${today()}T00:00:00`))/86400000);
      return delta < 0 ? 'OVERDUE' : delta <= 30 ? 'SOON' : '';
    };
    const isVisibleInYear = (p, year) => {
      const origin = getProjectYear(p);
      if (year === 'UNASSIGNED') return origin === null;
      if (origin === null || origin > Number(year)) return false;
      if (origin === Number(year)) return true;
      if (!isCompleted(p)) return true;
      const closeYear = exactYear(p.closedAt);
      return closeYear !== null && closeYear >= Number(year);
    };
    const normalizeTodos = v => (Array.isArray(v) ? v : []).map((t,i)=>({
      ...t, id:String(t?.id || `todo_legacy_${i}`), content:String(t?.content||''), owner:String(t?.owner||''),
      dueDate:String(t?.dueDate||''), notes:String(t?.notes||''), done:t?.done===true,
      completedAt:t?.completedAt || null
    }));
    const SUPERVISION_DEPTS = ['安衛處(龍德)','安衛處(彰化)','安衛處(麥寮)','安衛處(新港)','環保組','消防組'];

    const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const uid = (prefix='id') => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
    const deepClone = (v) => JSON.parse(JSON.stringify(v));
    const clampProgress = (v) => Math.min(100, Math.max(0, Number.parseInt(v, 10) || 0));
    const normalizeHexColor = (value, fallback='#64748b') => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value) : fallback;
    const toneHex = (tone='gray') => ({blue:'#2563eb',purple:'#9333ea',red:'#dc2626',orange:'#ea580c',green:'#16a34a',gray:'#64748b'}[tone] || '#64748b');
    const normalizeItems = (items, fallback) => {
      const list = Array.isArray(items) && items.length ? items : deepClone(fallback);
      return list.map((x,i) => {
        const fb = fallback.find(f => String(f.id) === String(x.id)) || fallback[i] || {};
        const fallbackColor = fb.color || toneHex(x.tone || fb.tone);
        return { ...x, id:String(x.id || uid('item')), label:String(x.label || '').trim(), active:x.active !== false, order:Number.isFinite(Number(x.order)) ? Number(x.order) : i + 1, color:normalizeHexColor(x.color, fallbackColor) };
      }).sort((a,b) => a.order - b.order);
    };
    const normalizePeople = (items=[]) => (Array.isArray(items) ? items : []).map((x,i) => ({
      ...x,
      id:String(x?.id || uid('person')),
      label:String(x?.label || x?.name || '').trim(),
      factoryId:String(x?.factoryId || ''),
      active:x?.active !== false,
      order:Number.isFinite(Number(x?.order)) ? Number(x.order) : i + 1
    })).filter(x => x.label).sort((a,b) => a.order - b.order);
    const splitPeople = (value='') => [...new Set(String(value || '').split(/[、,，;；\n]+/).map(x => x.trim()).filter(Boolean))];
    const hexToRgba = (hex, alpha=.14) => { const h=normalizeHexColor(hex).slice(1); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${alpha})`; };
    const darkenHex = (hex, amount=.28) => { const h=normalizeHexColor(hex).slice(1); const vals=[0,2,4].map(i=>Math.max(0,Math.round(parseInt(h.slice(i,i+2),16)*(1-amount)))); return `#${vals.map(v=>v.toString(16).padStart(2,'0')).join('')}`; };
    const contrastText = (hex) => { const h=normalizeHexColor(hex).slice(1); const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); return (r*299+g*587+b*114)/1000 > 165 ? '#0f172a' : '#ffffff'; };
    const tagStyle = (color, solid=false) => { const c=normalizeHexColor(color); return solid ? {backgroundColor:c,color:contrastText(c),borderColor:c} : {backgroundColor:hexToRgba(c,.12),color:darkenHex(c,.22),borderColor:hexToRgba(c,.32)}; };

    // Preserve historical percentages and any unknown properties; new entries never require a percentage.
    const normalizeLogs = (logs=[]) => (Array.isArray(logs) ? logs : []).map((r,i) => ({
      ...r,
      id:String(r?.id || `legacy_${i}_${r?.date || ''}`),
      date:r?.date || today(),
      person:String(r?.person || '').trim(),
      typeId:String(r?.typeId || ''),
      type:String(r?.type || '工作日報').trim() || '工作日報',
      content:String(r?.content || '')
    })).sort((a,b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));

    const App = () => {
      const [projects, setProjects] = useState([]);
      const [master, setMaster] = useState(() => deepClone(DEFAULT_MASTER));
      const [masterCloudOk, setMasterCloudOk] = useState(true);
      const [masterLoaded, setMasterLoaded] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isViewMode, setIsViewMode] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [isMasterOpen, setIsMasterOpen] = useState(false);
      const [masterTab, setMasterTab] = useState('factories');
      const [masterDraft, setMasterDraft] = useState(() => deepClone(DEFAULT_MASTER));
      const [filterType, setFilterType] = useState('ALL');
      const [filterFactory, setFilterFactory] = useState('ALL');
      const [filterStatus,setFilterStatus] = useState('ALL');
      const [filterAlert,setFilterAlert] = useState('ALL');
      const [keyword,setKeyword] = useState('');
      const [sortKey,setSortKey] = useState('DUE_ASC');
      const [selectedYear,setSelectedYear] = useState(String(new Date().getFullYear()));
      const [selectedType, setSelectedType] = useState('ENGINEERING');
      const [selectedFactory, setSelectedFactory] = useState('');
      const [selectedPermitCategories, setSelectedPermitCategories] = useState([]);
      const [selectedSupervisionDept, setSelectedSupervisionDept] = useState(SUPERVISION_DEPTS[0]);
      const [selectedStatus,setSelectedStatus] = useState('NOT_STARTED');
      const [executionLogs, setExecutionLogs] = useState([]);
      const [logDraft, setLogDraft] = useState({ id:null, date:today(), person:'', typeId:'WORK_LOG', customType:'', content:'' });
      const [todos,setTodos] = useState([]);
      const emptyTodo = () => ({id:null,content:'',owner:'',dueDate:'',notes:''});
      const [todoDraft,setTodoDraft] = useState(emptyTodo);
      const fileInputRef = useRef(null);
      const factories = useMemo(() => normalizeItems(master.factories, DEFAULT_MASTER.factories), [master.factories]);
      const projectTypes = useMemo(() => normalizeItems(master.projectTypes, DEFAULT_MASTER.projectTypes), [master.projectTypes]);
      const permitCategories = useMemo(() => normalizeItems(master.permitCategories, DEFAULT_MASTER.permitCategories), [master.permitCategories]);
      const progressTypes = useMemo(() => normalizeItems(master.progressTypes, DEFAULT_MASTER.progressTypes), [master.progressTypes]);
      const people = useMemo(() => normalizePeople(master.people), [master.people]);
      const typeMap = useMemo(() => Object.fromEntries(projectTypes.map(x => [x.id, x])), [projectTypes]);
      const factoryMap = useMemo(() => Object.fromEntries(factories.map(x => [x.id, x])), [factories]);
      const permitMap = useMemo(() => Object.fromEntries(permitCategories.map(x => [x.id, x])), [permitCategories]);
      const progressTypeMap = useMemo(() => Object.fromEntries(progressTypes.map(x => [x.id, x])), [progressTypes]);

      useEffect(() => {
        let unsubProjects = null;
        let unsubMaster = null;
        (async () => {
          try {
            await window.__firebaseReady;
            unsubProjects = window.__fs_subscribe((list) => {
              setProjects(list.map(d => ({
                ...d,
                id:d.id,
                createdAt:d.createdAt?.toDate ? d.createdAt.toDate() : d.createdAt,
                updatedAt:d.updatedAt?.toDate ? d.updatedAt.toDate() : d.updatedAt
              })));
              setIsLoading(false);
            }, (err) => {
              console.error(err);
              setIsLoading(false);
              alert(window.__firebaseErrorText ? window.__firebaseErrorText(err, 'Firebase 讀取失敗') : `Firebase 讀取失敗：${err?.message || err}`);
            });
            unsubMaster = window.__fs_subscribe_master((data) => {
              const nextFactories = normalizeItems(data.factories, DEFAULT_MASTER.factories);
              const next = {
                factories:nextFactories,
                projectTypes:normalizeItems(data.projectTypes, DEFAULT_MASTER.projectTypes),
                permitCategories:normalizeItems(data.permitCategories, DEFAULT_MASTER.permitCategories),
                progressTypes:normalizeItems(data.progressTypes, DEFAULT_MASTER.progressTypes),
                people:normalizePeople(data.people),
                years:Array.isArray(data.years) ? data.years.filter(x=>/^\d{4}$/.test(String(x.id||''))) : []
              };
              setMaster(next);
              setMasterCloudOk(true);
              setMasterLoaded(true);
            }, (err) => {
              console.warn('基本資料雲端同步失敗，暫用預設值', err);
              setMasterCloudOk(false);
              setMasterLoaded(false);
            });
          } catch (e) {
            console.error(e);
            setIsLoading(false);
            alert(window.__firebaseErrorText ? window.__firebaseErrorText(e, 'Firebase 初始化失敗') : `Firebase 初始化失敗：${e?.message || e}`);
          }
        })();
        return () => { if (unsubProjects) unsubProjects(); if (unsubMaster) unsubMaster(); };
      }, []);

      useEffect(() => {
        if (!isModalOpen) return;
        const logs = normalizeLogs(editingProject?.executionLogs || []);
        const defaultFactory = editingProject?.factory || factories.find(x => x.active)?.id || '';
        const currentDept = editingProject?.supervisionDept || SUPERVISION_DEPTS[0];
        setExecutionLogs(logs);
        setSelectedType(editingProject?.type || projectTypes.find(x => x.active)?.id || 'ENGINEERING');
        setSelectedFactory(defaultFactory);
        setSelectedPermitCategories(Array.isArray(editingProject?.permitCategories) ? editingProject.permitCategories : []);
        setSelectedSupervisionDept(SUPERVISION_DEPTS.includes(currentDept) ? currentDept : 'OTHER');
        setSelectedStatus(editingProject ? (editingProject.executionStatus || '') : 'NOT_STARTED');
        setTodos(normalizeTodos(editingProject?.todos));
        setTodoDraft(emptyTodo());

      const sortedFilteredProjects=useMemo(()=>{

          if(sortKey==='START_ASC') return cmpText(a.startDate,b.startDate);

      const openModal = (p=null, viewOnly=false) => {

      const handleDeleteProject = async (id, e) => {

      const resetLogDraft = () => {

      };
      const saveProgressLog = () => {
        const selectedProgressType = progressTypes.find(x => x.id === logDraft.typeId);
        const isOther = selectedProgressType?.id === 'OTHER';
        const finalType = isOther ? String(logDraft.customType||'').trim() : String(selectedProgressType?.label||'').trim();

        if(!selectedProgressType || !finalType || !content) return alert('請輸入完整的紀錄類型及內容');
        const previous=executionLogs.find(x=>x.id===logDraft.id);
        const item={...previous,id:logDraft.id || uid('log'),date:logDraft.date||today(),person:String(logDraft.person||'').trim(),typeId:selectedProgressType.id,type:finalType,content};
        setExecutionLogs(prev=>normalizeLogs(logDraft.id ? prev.map(x=>x.id===logDraft.id?item:x) : [item,...prev]));
        resetLogDraft();
      };

      const editProgressLog = (log) => {
        const matched = progressTypes.find(x => x.id === log.typeId) || progressTypes.find(x => x.label === log.type);
        const typeId = matched?.id || 'OTHER';
        const customType = typeId === 'OTHER' ? (matched && log.type === matched.label ? '' : log.type) : '';
        setLogDraft({ id:log.id, date:log.date || today(), person:log.person || '', typeId, customType, content:log.content || '' });

      const deleteProgressLog = (id) => {
        if (!confirm('確定刪除這筆進度紀錄？')) return;

      const saveTodo = () => {
        const content=todoDraft.content.trim();
        if(!content || !todoDraft.dueDate || exactYear(todoDraft.dueDate)===null) return alert('請填寫待辦事項及有效預定完成日');
        const previous=todos.find(x=>x.id===todoDraft.id);
        const item={...previous,id:todoDraft.id||uid('todo'),content,owner:todoDraft.owner.trim(),dueDate:todoDraft.dueDate,notes:todoDraft.notes.trim(),done:previous?.done||false,completedAt:previous?.completedAt||null,createdAt:previous?.createdAt||today()};
        setTodos(prev=>todoDraft.id?prev.map(x=>x.id===todoDraft.id?item:x):[...prev,item]);
        setTodoDraft(emptyTodo());
      };
      const markTodo=(id,done)=>setTodos(prev=>prev.map(t=>t.id===id?{...t,done,completedAt:done?today():null}:t));
      const removeTodo=id=>{if(window.confirm('確定刪除此待辦事項？此操作在儲存專案後生效。'))setTodos(prev=>prev.filter(x=>x.id!==id));};
      const handleSave = async (e) => {
        e.preventDefault();
        if (isViewMode) return;

        if (!selectedFactory) return alert('請選擇廠區');
        if (selectedType === 'PERMIT' && selectedPermitCategories.length === 0) return alert('法規／證照申請請至少勾選一個法規類別');
        const startDate=String(formData.get('startDate')||'');
        const endDate=String(formData.get('endDate')||'');
        const origin=exactYear(startDate);
        if(origin===null || exactYear(endDate)===null) return alert('請輸入有效的開始及結束日期');
        if(endDate<startDate) return alert('預定結束日期不能早於開始日期');
        const priorOrigin=editingProject?getProjectYear(editingProject):null;
        if(editingProject && priorOrigin!==origin && !window.confirm(`開始日期所屬年度將由 ${priorOrigin||'未設定'} 改為 ${origin}，專案將移至對應年度。是否繼續？`))return;
        const projectData = {
          name:formData.get('name'),
          projectContent:formData.get('projectContent')||'',
          type:selectedType,
          customTypeName:selectedType==='OTHER'?(formData.get('customTypeName')||''):'',
          factory:selectedFactory,
          permitCategories:selectedType==='PERMIT'?selectedPermitCategories:[],
          mainDept:formData.get('mainDept')||'',
          mainPic:formData.get('mainPic')||'',
          supervisionDept:selectedSupervisionDept==='OTHER'?(formData.get('customSupervisionDept')||''):selectedSupervisionDept,
          supervisionPic:formData.get('supervisionPic')||'',
          startDate,endDate,projectYear:origin,
          description:formData.get('description')||'',
          executionLogs:normalizeLogs(executionLogs),
          todos:normalizeTodos(todos)
        };
        if(selectedStatus){
          projectData.executionStatus=selectedStatus;
          if(!editingProject?.executionStatus)projectData.statusConfirmedAt=today();

            if(editingProject?.executionStatus==='COMPLETED') { /* existing closure date left intact */ }
            else if(editingProject?.status==='COMPLETED' && !editingProject?.executionStatus) { /* legacy close time unknown; do not fabricate a timestamp */ }
            else projectData.closedAt=today();
          }else if(editingProject?.executionStatus==='COMPLETED')projectData.closedAt=null;
        }
        try {
          if (editingProject) await window.__fs_update(editingProject.id, projectData);
          else await window.__fs_add(projectData);
          // Cross-year edits should keep the selected tracking year whenever the project remains visible there.

          setIsModalOpen(false);
          setEditingProject(null);
        } catch (err) { alert(`儲存失敗：${err?.message || err}`); }
      };

      const openMaster = () => {
        setMasterDraft(deepClone({ factories, projectTypes, permitCategories, progressTypes, people }));
        setMasterTab('factories');
        setIsMasterOpen(true);
      };

      const updateMasterItem = (key, id, patch) => setMasterDraft(prev => ({ ...prev, [key]:prev[key].map(x => x.id === id ? { ...x, ...patch } : x) }));
      const moveMasterItem = (key, id, delta) => setMasterDraft(prev => {
        const arr = [...prev[key]].sort((a,b) => a.order - b.order);
        const idx = arr.findIndex(x => x.id === id);
        const target = idx + delta;
        if (idx < 0 || target < 0 || target >= arr.length) return prev;
        [arr[idx], arr[target]] = [arr[target], arr[idx]];
        return { ...prev, [key]:arr.map((x,i) => ({ ...x, order:i + 1 })) };
      });
      const addMasterItem = (key) => setMasterDraft(prev => {
        const arr = prev[key];
        const prefix = key === 'factories' ? 'FAC' : key === 'projectTypes' ? 'TYPE' : key === 'permitCategories' ? 'PERMIT' : key === 'people' ? 'PERSON' : 'PROGRESS';
        const defaultColor = '#64748b';
        const base = { id:`${prefix}_${Date.now().toString(36).toUpperCase()}`, label:'', active:true, order:arr.length + 1, color:defaultColor };
        if (key === 'projectTypes') base.tone = 'gray';
        if (key === 'people') base.factoryId = prev.factories.find(x => x.active)?.id || prev.factories[0]?.id || '';
        return { ...prev, [key]:[...arr, base] };
      });

      const isProgressTypeUsed = (item) => projects.some(p => normalizeLogs(p.executionLogs || []).some(log => log.typeId === item.id || (!log.typeId && log.type === item.label)));
      const deleteProgressType = (id) => setMasterDraft(prev => {
        const item = prev.progressTypes.find(x => x.id === id);
        if (!item) return prev;
        if (item.id === 'OTHER') { alert('「其他」為保留類型，無法刪除。'); return prev; }
        if (isProgressTypeUsed(item)) { alert('此進度類型已有歷史紀錄使用，無法刪除；請改為停用。'); return prev; }
        if (!confirm(`確定刪除進度類型「${item.label || id}」？`)) return prev;
        return { ...prev, progressTypes:prev.progressTypes.filter(x => x.id !== id).map((x,i) => ({...x,order:i+1})) };
      });

      const saveMaster = async () => {
        for (const key of ['factories','projectTypes','permitCategories','progressTypes','people']) {
          if (masterDraft[key].some(x => !String(x.label || '').trim())) return alert('基本資料名稱不可空白');
        }
        if (masterDraft.people.some(x => !String(x.factoryId || '').trim())) return alert('每位人員都必須指定廠區');
        const personNames = masterDraft.people.map(x => String(x.label || '').trim().toLocaleLowerCase('zh-Hant'));
        if (new Set(personNames).size !== personNames.length) return alert('人員名稱不可重複');
        const normalized = {
          factories:normalizeItems(masterDraft.factories, DEFAULT_MASTER.factories),
          projectTypes:normalizeItems(masterDraft.projectTypes, DEFAULT_MASTER.projectTypes),
          permitCategories:normalizeItems(masterDraft.permitCategories, DEFAULT_MASTER.permitCategories),
          progressTypes:normalizeItems(masterDraft.progressTypes, DEFAULT_MASTER.progressTypes).map(x => x.id === 'OTHER' ? {...x,active:true} : x),
          people:normalizePeople(masterDraft.people)
        };
        try {
          await Promise.all(Object.entries(normalized).map(([key,items]) => window.__fs_save_master(key, items)));
          setMaster(prev=>({...prev,...normalized}));
          setMasterCloudOk(true);
          setIsMasterOpen(false);
        } catch (err) {
          console.error(err);
          setMasterCloudOk(false);
          alert(`基本資料儲存失敗：${err?.message || err}`);
        }
      };

      const csvEscape = (v) => `"${String(v ?? '').replace(/"/g,'""')}"`;
      const handleExportCSV = () => {
        // CSV is a working-table exchange format. Use the complete JSON export for backups.
        const headers=['名稱','摘要','類型','自定義類型','廠區','法規類別','主辦部門','主辦人','督導部門','督導人員',
          '開始日期','結束日期','原始年度','執行狀態','舊狀態','辦理紀錄','待辦事項','備註'];
        const rows=projects.map(p=>[
          p.name,p.projectContent,p.type,p.customTypeName,p.factory,(p.permitCategories||[]).join('|'),p.mainDept,p.mainPic,
          p.supervisionDept,p.supervisionPic,p.startDate,p.endDate,getProjectYear(p)||'',p.executionStatus||'',p.status||'',
          JSON.stringify(p.executionLogs||[]),JSON.stringify(p.todos||[]),p.description||''
        ].map(csvEscape));
        const blob=new Blob(['\uFEFF'+[headers.map(csvEscape).join(','),...rows.map(r=>r.join(','))].join('\n')],{type:'text/csv;charset=utf-8'});
        const url=URL.createObjectURL(blob);const link=document.createElement('a');
        link.href=url;link.download=`安衛環專案管制_${today()}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      };

      const handleExportJSON=()=>{
        if(!masterCloudOk || !masterLoaded || isLoading)return alert('雲端資料尚未完整同步，暫停備份；請先確認登入與網路狀態。');
        const data={format:'EHS_PROJECT_R1_BACKUP',version:'1.0',exportedAt:new Date().toISOString(),
          firebaseProject:'esh-v85',appId:window.__APP_ID,
          projects:projects.map(p=>({...p,createdAt:p.createdAt instanceof Date?p.createdAt.toISOString():p.createdAt,updatedAt:p.updatedAt instanceof Date?p.updatedAt.toISOString():p.updatedAt})),
          master:deepClone(master),count:projects.length};
        if(data.projects.length!==data.count || !Array.isArray(data.master.factories))return alert('備份驗證失敗，請勿使用此檔');
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
        const link=document.createElement('a');const url=URL.createObjectURL(blob);
        link.href=url;link.download=`安衛環完整備份_${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      };
      const parseCsvRecords = text => {
        const out=[];let row=[],field='',quoted=false;
        for(let i=0;i<text.length;i++){
          const c=text[i];
          if(quoted){if(c==='"' && text[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}
          else if(c==='"')quoted=true;
          else if(c===','){row.push(field);field='';}
          else if(c==='\n' || c==='\r'){
            if(c==='\r' && text[i+1]==='\n')i++;
            row.push(field);if(row.some(v=>v.trim()))out.push(row);row=[];field='';
          }else field+=c;
        }
        if(quoted)throw new Error('CSV 引號未正確結束');
        row.push(field);if(row.some(v=>v.trim()))out.push(row);
        return out;
      };
      const handleImportCSV = (e) => {
        const file=e.target.files?.[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=async event=>{
          try {
            const records=parseCsvRecords(String(event.target.result||''));
            if(records.length<2)return alert('CSV 沒有可匯入的資料');
            const headers=records[0].map(x=>x.replace(/^\uFEFF/,''));
            const idx=name=>headers.indexOf(name);
            if(idx('名稱')<0 || idx('開始日期')<0 || idx('結束日期')<0)return alert('CSV 缺少必要欄位：名稱、開始日期或結束日期');
            if(!window.confirm('CSV 匯入會新增專案，不會覆寫舊專案；相同「名稱＋廠區＋開始日期」將跳過。確定繼續？'))return;
            const existing=new Set(projects.map(p=>[p.name,p.factory,p.startDate].join('\u0001')));
            let added=0,skipped=0;
            for(const cols of records.slice(1)){
              const get=(name,oldIndex=-1)=>idx(name)>=0?(cols[idx(name)]||''):(oldIndex>=0?(cols[oldIndex]||''):'');
              const isNew=idx('廠區')>=0;
              const name=get('名稱',0).trim();
              const startDate=get('開始日期',isNew?10:8);
              const endDate=get('結束日期',isNew?11:9);
              const factory=isNew?get('廠區'):'';
              const key=[name,factory,startDate].join('\u0001');
              if(existing.has(key)){skipped++;continue;}
              if(!name||exactYear(startDate)===null||exactYear(endDate)===null||endDate<startDate)throw new Error(`第 ${added+skipped+2} 列名稱或日期不正確`);
              const json=(field)=>{try{const x=JSON.parse(field||'[]');return Array.isArray(x)?x:[];}catch(_){return [];}};
              const oldFormat=idx('預計進度')>=0;
              const p={
                name,projectContent:get('摘要',1),type:get('類型',2),customTypeName:get('自定義類型',3),factory,
                permitCategories:isNew?String(get('法規類別')).split('|').filter(Boolean):[],
                mainDept:get('主辦部門',isNew?6:4),mainPic:get('主辦人',isNew?7:5),
                supervisionDept:get('督導部門',isNew?8:6),supervisionPic:get('督導人員',isNew?9:7),
                startDate,endDate,projectYear:exactYear(startDate),
                executionLogs:normalizeLogs(json(get('辦理紀錄')||get('執行說明',oldFormat?(isNew?15:13):-1))),
                todos:normalizeTodos(json(get('待辦事項'))),
                description:get('備註',isNew?(oldFormat?16:-1):14)
              };
              const newStatus=get('執行狀態');
              if(newStatus && STATUS_TYPES[newStatus]){p.executionStatus=newStatus;p.statusConfirmedAt=today();}
              const legacy=get('舊狀態')||get('狀態',oldFormat?(isNew?14:12):-1);
              if(legacy)p.status=legacy;
              if(oldFormat){p.expectedProgress=clampProgress(get('預計進度'));p.progress=clampProgress(get('實際進度'));}
              await window.__fs_add(p);
              existing.add(key);added++;
            }
            alert(`匯入完成：新增 ${added} 筆，跳過重複 ${skipped} 筆。`);
          }catch(err){alert(`CSV 匯入中止：${err?.message||err}`);}
          finally{e.target.value='';}
        };
        reader.readAsText(file);
      };

      if (isLoading) return <div className="h-screen flex items-center justify-center flex-col gap-4"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div><p className="text-gray-500 font-bold">同步中...</p></div>;

      const masterLabels = { factories:'廠區管理', people:'人員管理', projectTypes:'專案類型管理', permitCategories:'法規類別管理', progressTypes:'進度類型管理' };
      const currentMasterItems = [...(masterDraft[masterTab] || [])].sort((a,b) => a.order - b.order);

      return (
        <div className="min-h-screen bg-gray-50 p-4 lg:p-6 text-gray-800">
          <div className="max-w-[1700px] mx-auto">
            <input type="file" ref={fileInputRef} onChange={handleImportCSV} accept=".csv" className="hidden" />

            <div className="mb-4 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
              <div className="flex flex-col xl:flex-row justify-between gap-3 xl:items-center">
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <h1 className="text-2xl font-bold text-gray-800">年度安衛環專案管制總表</h1>
                    <span className="text-[11px] px-2 py-1 bg-blue-50 text-blue-700 rounded-lg font-bold">R1.0 專案執行與待辦追蹤</span>
                    {!masterCloudOk && <span className="text-xs text-amber-700">基本資料雲端同步異常</span>}
                  </div>
                  <p className="text-xs text-slate-500 mt-2">各年度分開管理；跨年度未結案件共用原始專案，不產生副本。</p>
                </div>
                <div className="flex flex-wrap gap-2 items-center">
                  <label className="text-xs font-bold text-slate-600">管理年度</label>
                  <select aria-label="管理年度" value={selectedYear} onChange={e=>setSelectedYear(e.target.value)} className="p-2 border rounded-lg bg-white font-bold text-sm">
                    {availableYears.map(y=><option key={y} value={String(y)}>{y}年度</option>)}
                    <option value="UNASSIGNED">年度待確認</option>
                  </select>
                  <button onClick={addYear} className="px-3 py-2 rounded-lg text-sm font-bold bg-slate-100 hover:bg-slate-200">＋ 新增年度</button>
                  <button onClick={openMaster} className="px-3 py-2 border rounded-lg text-sm font-bold">基本資料</button>
                  <button onClick={()=>openModal(null,false)} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm">＋ 新增專案</button>
                  <button onClick={()=>fileInputRef.current?.click()} className="px-3 py-2 border rounded-lg text-sm">CSV匯入</button>
                  <button onClick={handleExportCSV} className="px-3 py-2 border rounded-lg text-sm">CSV匯出</button>
                  <button onClick={handleExportJSON} className="px-3 py-2 border border-emerald-300 text-emerald-700 rounded-lg font-bold text-sm">完整JSON備份</button>
                </div>
              </div>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-2 mb-4">
              {[['年度追蹤',stats.total],['本年度立案',stats.origin],['跨年度延續',stats.carry],['未結案',stats.active],['已結案',stats.closed],['專案逾期',stats.overdue],['待辦逾期',stats.todoOverdue],['30天內待辦',stats.todoSoon]].map(([label,count])=><div key={label} className="bg-white border border-slate-200 rounded-xl p-3"><div className="text-xs text-slate-500 font-bold">{label}</div><div className="text-xl font-extrabold text-slate-800 mt-1">{count}</div></div>)}
            </div>
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 mb-3 space-y-3">
              <div className="flex flex-wrap items-center gap-2">
                <input aria-label="搜尋專案" placeholder="搜尋專案、人員、最新紀錄、待辦..." value={keyword} onChange={e=>setKeyword(e.target.value)} className="border rounded-lg px-3 py-2 flex-1 min-w-[210px] text-sm" />
                <select aria-label="廠區篩選" value={filterFactory} onChange={e=>setFilterFactory(e.target.value)} className="border rounded-lg px-2 py-2 text-sm bg-white"><option value="ALL">全部廠區</option>{factories.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}</select>
                <select aria-label="專案類型篩選" value={filterType} onChange={e=>setFilterType(e.target.value)} className="border rounded-lg px-2 py-2 text-sm bg-white"><option value="ALL">全部類型</option>{projectTypes.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
                <select aria-label="狀態篩選" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="border rounded-lg px-2 py-2 text-sm bg-white"><option value="ALL">全部狀態</option><option value="LEGACY">舊狀態待確認</option>{Object.entries(STATUS_TYPES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>
                <select aria-label="期限篩選" value={filterAlert} onChange={e=>setFilterAlert(e.target.value)} className="border rounded-lg px-2 py-2 text-sm bg-white"><option value="ALL">全部期限</option><option value="OVERDUE">逾期</option><option value="SOON">30天內到期</option></select>
                <select aria-label="排序方式" value={sortKey} onChange={e=>setSortKey(e.target.value)} className="border rounded-lg px-2 py-2 text-sm bg-white"><option value="DUE_ASC">期限近→遠</option><option value="DUE_DESC">期限遠→近</option><option value="UPDATED">最近更新</option><option value="START_ASC">開始日期</option><option value="NAME">專案名稱</option></select>
              </div>
              <div className="flex items-center justify-between text-xs text-slate-500"><span>符合條件：<b className="text-slate-700">{sortedFilteredProjects.length}</b> 筆；其中年度延續專案依原案同步更新。</span><button onClick={()=>{setFilterFactory('ALL');setFilterType('ALL');setFilterStatus('ALL');setFilterAlert('ALL');setKeyword('');setSortKey('DUE_ASC');}} className="text-blue-600 font-bold">清除篩選</button></div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-x-auto">
              <table className="project-table min-w-[1250px] w-full text-sm text-left border-collapse">
                <thead><tr className="text-slate-600 text-xs">
                  <th className="p-3 w-32">廠區／類型</th><th className="p-3 min-w-[230px]">專案名稱</th><th className="p-3 w-36">主辦人</th><th className="p-3 w-44">執行狀態</th><th className="p-3 w-32">預定完成日</th><th className="p-3 min-w-[240px]">最新辦理紀錄</th><th className="p-3 min-w-[260px]">下一步待辦</th><th className="p-3 w-28">操作</th>
                </tr></thead>
                <tbody>
                  {sortedFilteredProjects.length===0 && <tr><td colSpan="8" className="text-center p-12 text-slate-400">本年度沒有符合篩選條件的專案。</td></tr>}
                  {sortedFilteredProjects.map(p=>{
                    const origin=getProjectYear(p);const f=factoryMap[p.factory];const t=typeMap[p.type];
                    const latest=normalizeLogs(p.executionLogs||[])[0];
                    const openTodos=todoList(p).filter(x=>!x.done).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)));
                    const nextTodo=openTodos[0];const alertKey=projectAlert(p);
                    return <tr key={p.id} className="hover:bg-blue-50/50">
                      <td className="p-3"><div className="text-[11px] font-bold text-slate-700">{f?.label||'未設定'}</div><div className="text-[11px] text-slate-500 mt-1">{p.type==='OTHER'&&p.customTypeName?p.customTypeName:(t?.label||p.type)}</div></td>
                      <td className="p-3"><button onClick={()=>openModal(p,true)} className="font-bold text-blue-700 hover:underline text-left break-words">{p.name||'未命名'}</button><div className="text-[11px] text-slate-500 mt-1">{origin===Number(selectedYear)?'本年度立案':`原始年度 ${origin||'待確認'} · 跨年度延續`}</div>{p.projectContent&&<div className="text-[11px] text-slate-500 mt-1 line-clamp-2">{p.projectContent}</div>}</td>
                      <td className="p-3"><div className="font-medium">{p.mainPic||'—'}</div><div className="text-xs text-slate-500 mt-1">{p.mainDept||''}</div></td>
                      <td className="p-3"><div className={`font-bold text-xs ${p.executionStatus?(STATUS_TYPES[p.executionStatus]?.color||'text-slate-600'):'text-amber-700'}`}>{statusLabel(p)}</div>{!p.executionStatus&&<div className="text-[10px] text-amber-700 mt-1">請逐筆確認新版狀態</div>}</td>
                      <td className="p-3"><div className="font-bold">{p.endDate||'—'}</div>{alertKey==='OVERDUE'&&<span className="inline-block text-[11px] text-red-700 bg-red-50 rounded px-2 py-1 mt-1">逾期未結</span>}{alertKey==='SOON'&&<span className="inline-block text-[11px] text-amber-700 bg-amber-50 rounded px-2 py-1 mt-1">30天內到期</span>}</td>
                      <td className="p-3">{latest?<><div className="text-[11px] text-slate-500">{latest.date} · {latest.type} · {latest.person||'未填人員'}</div><div className="line-clamp-3 whitespace-pre-wrap text-xs mt-1">{latest.content}</div></>:<span className="text-slate-400 text-xs">尚無辦理紀錄</span>}</td>
                      <td className="p-3">{nextTodo?<><div className="text-xs font-semibold whitespace-pre-wrap">{nextTodo.content}</div><div className="text-[11px] text-slate-500 mt-1">{nextTodo.owner||'未指定'} · {nextTodo.dueDate}</div>{todoAlert(nextTodo.dueDate)==='OVERDUE'&&<span className="text-[11px] text-red-700">逾期</span>}{todoAlert(nextTodo.dueDate)==='SOON'&&<span className="text-[11px] text-amber-700">即將到期</span>}{openTodos.length>1&&<div className="text-[11px] text-slate-400 mt-1">另有 {openTodos.length-1} 筆未完成</div>}</>:<span className="text-slate-400 text-xs">無未完成待辦</span>}</td>
                      <td className="p-3"><div className="flex gap-2 flex-wrap"><button onClick={()=>openModal(p,true)} className="text-slate-600 text-xs font-bold">查看</button><button onClick={()=>openModal(p,false)} className="text-blue-600 text-xs font-bold">編輯</button><button onClick={e=>handleDeleteProject(p.id,e)} className="text-red-600 text-xs font-bold">刪除</button></div></td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {isModalOpen && <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"><div className="resizable-container w-[1120px] h-[88vh]"><div className="bg-gray-800 p-5 flex justify-between items-center text-white shrink-0"><h3 className="font-bold text-lg">{isViewMode ? '查看專案' : editingProject ? '編輯專案' : '新增專案'}</h3><button onClick={() => setIsModalOpen(false)} className="p-1 text-xl">✕</button></div>
            <form onSubmit={handleSave} className="flex-1 overflow-y-auto p-6 space-y-5 bg-white">
              <fieldset disabled={isViewMode} className="space-y-5">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="md:col-span-2"><label className="block text-sm font-bold text-gray-700 mb-1">專案名稱</label><input required name="name" defaultValue={editingProject?.name || ''} className="w-full p-2.5 border rounded-xl bg-white disabled:bg-gray-50"/></div>
                  <div className="md:col-span-2"><label className="block text-sm font-bold text-gray-700 mb-1">摘要內容</label><textarea name="projectContent" defaultValue={editingProject?.projectContent || ''} className="w-full p-2.5 border rounded-xl h-20 resize-y bg-white disabled:bg-gray-50"/></div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1">廠區 *</label><select required value={selectedFactory} onChange={e => setSelectedFactory(e.target.value)} className="w-full p-2.5 border rounded-xl bg-white"><option value="">請選擇廠區</option>{factories.filter(f => f.active || f.id === editingProject?.factory).map(f => <option key={f.id} value={f.id}>{f.label}{f.active ? '' : '（已停用）'}</option>)}</select></div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1">專案類型</label><select value={selectedType} onChange={e => setSelectedType(e.target.value)} className="w-full p-2.5 border rounded-xl bg-white">{projectTypes.filter(t => t.active || t.id === editingProject?.type).map(t => <option key={t.id} value={t.id}>{t.label}{t.active ? '' : '（已停用）'}</option>)}</select></div>
                  {selectedType === 'OTHER' && <div className="md:col-span-2"><label className="block text-sm font-bold text-gray-700 mb-1">其他專案類型名稱</label><input name="customTypeName" defaultValue={editingProject?.customTypeName || ''} className="w-full p-2.5 border rounded-xl"/></div>}
                  {selectedType === 'PERMIT' && <div className="md:col-span-2 bg-purple-50/60 border border-purple-100 rounded-xl p-4"><label className="block text-sm font-bold text-purple-800 mb-3">法規類別（可複選）*</label><div className="flex flex-wrap gap-2">{permitCategories.filter(x => x.active || selectedPermitCategories.includes(x.id)).map(c => <label key={c.id} className={`flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer ${selectedPermitCategories.includes(c.id) ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-purple-700 border-purple-200'}`}><input type="checkbox" checked={selectedPermitCategories.includes(c.id)} onChange={() => togglePermitCategory(c.id)} className="accent-purple-600"/><span className="text-sm font-bold">{c.label}{c.active ? '' : '（已停用）'}</span></label>)}</div></div>}
                  <div><label className="block text-sm font-bold text-gray-700 mb-1">執行狀態</label><select value={selectedStatus} onChange={e=>setSelectedStatus(e.target.value)} className="w-full p-2.5 border rounded-xl bg-white">{editingProject&&!editingProject.executionStatus&&<option value="">舊狀態：{LEGACY_STATUS[editingProject.status]||editingProject.status||'未設定'}（待人工確認）</option>}{Object.entries(STATUS_TYPES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>{editingProject&&!editingProject.executionStatus&&<p className="text-xs text-amber-700 mt-1">舊狀態不自動轉換；選擇新版狀態才正式確認。</p>}</div>
                </div>

                <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div><label className="block text-xs font-bold text-gray-500 mb-1">主辦部門</label><input name="mainDept" defaultValue={editingProject?.mainDept || ''} className="w-full p-2 border rounded-lg bg-white"/></div>
                  <div><label className="block text-xs font-bold text-gray-500 mb-1">主辦人</label><input name="mainPic" defaultValue={editingProject?.mainPic || ''} className="w-full p-2 border rounded-lg bg-white"/></div>
                  <div><label className="block text-xs font-bold text-gray-500 mb-1">督導部門</label><select value={selectedSupervisionDept} onChange={e => setSelectedSupervisionDept(e.target.value)} className="w-full p-2 border rounded-lg bg-white">{SUPERVISION_DEPTS.map(d => <option key={d} value={d}>{d}</option>)}<option value="OTHER">其他 (自行輸入)</option></select>{selectedSupervisionDept === 'OTHER' && <input name="customSupervisionDept" defaultValue={SUPERVISION_DEPTS.includes(editingProject?.supervisionDept) ? '' : (editingProject?.supervisionDept || '')} className="w-full p-2 border rounded-lg bg-white mt-2" placeholder="輸入督導部門"/>}</div>
                  <div><label className="block text-xs font-bold text-gray-500 mb-1">督導人員</label><input name="supervisionPic" defaultValue={editingProject?.supervisionPic || ''} className="w-full p-2 border rounded-lg bg-white"/></div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                  <div><label className="block text-sm font-bold text-gray-700 mb-1">開始日期</label><input type="date" required name="startDate" defaultValue={editingProject?.startDate || (selectedYear==='UNASSIGNED'||Number(selectedYear)===new Date().getFullYear()?today():`${selectedYear}-01-01`)} className="w-full p-2.5 border rounded-xl bg-white"/></div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1">預計結束</label><input type="date" required name="endDate" defaultValue={editingProject?.endDate || (selectedYear==='UNASSIGNED'||Number(selectedYear)===new Date().getFullYear()?today():`${selectedYear}-12-31`)} className="w-full p-2.5 border rounded-xl bg-white"/></div>
                </div>

                <div className="border border-slate-200 rounded-2xl p-5 bg-white">
                  <div className="flex items-center justify-between mb-3"><div><h4 className="text-sm font-bold text-slate-700">辦理進度紀錄</h4><p className="text-[11px] text-slate-400 mt-1">紀錄實際辦理情形；不再要求填寫百分比。歷程依日期由新到舊顯示。</p></div><span className="text-[11px] font-bold text-slate-400">{executionLogs.length} 筆</span></div>
                  {!isViewMode && <div id="progress-entry" className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <div><label className="block text-[11px] font-bold text-slate-400 mb-1">日期</label><input type="date" value={logDraft.date} onChange={e => setLogDraft({...logDraft,date:e.target.value})} className="w-full p-2.5 border rounded-lg bg-white"/></div>
                      <div><label className="block text-[11px] font-bold text-slate-400 mb-1">人員（可複選）</label><details className="person-picker relative"><summary className="w-full min-h-[46px] p-2.5 border rounded-lg bg-white cursor-pointer flex items-center justify-between gap-2"><span className={selectedLogPeople.length ? 'text-slate-700 font-bold truncate' : 'text-slate-400'}>{selectedLogPeople.length ? selectedLogPeople.join('、') : '請勾選人員'}</span><span className="text-slate-400">⌄</span></summary><div className="absolute z-40 mt-1 w-full min-w-[240px] max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl p-2">{logPeopleOptions.length ? logPeopleOptions.map(person => <label key={person.id} className="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-blue-50 cursor-pointer"><input type="checkbox" checked={selectedLogPeople.includes(person.label)} onChange={() => toggleLogPerson(person.label)} className="accent-blue-600"/><span className="text-sm font-bold text-slate-700">{person.label}{person.retained ? <span className="text-[10px] text-amber-600 ml-1">（已選保留）</span> : ''}</span></label>) : <div className="px-3 py-4 text-xs text-slate-400">此廠區尚未建立人員，請至基本資料新增。</div>}</div></details></div>
                      <div><label className="block text-[11px] font-bold text-slate-400 mb-1">類型</label><select value={logDraft.typeId} onChange={e => setLogDraft({...logDraft,typeId:e.target.value,customType:e.target.value === 'OTHER' ? logDraft.customType : ''})} className="w-full p-2.5 border rounded-lg bg-white">{progressTypes.filter(x => x.active || x.id === logDraft.typeId).map(x => <option key={x.id} value={x.id}>{x.label}{x.active ? '' : '（已停用）'}</option>)}</select></div>
                      
                    </div>
                    {logDraft.typeId === 'OTHER' && <div><label className="block text-[11px] font-bold text-slate-400 mb-1">其他類型名稱</label><input value={logDraft.customType} onChange={e => setLogDraft({...logDraft,customType:e.target.value})} className="w-full p-2.5 border rounded-lg bg-white" placeholder="例如：教育訓練、稽核追蹤"/></div>}
                    <div><label className="block text-[11px] font-bold text-slate-400 mb-1">內容</label><textarea value={logDraft.content} onChange={e => setLogDraft({...logDraft,content:e.target.value})} rows="3" className="w-full p-3 border rounded-lg bg-white resize-y" placeholder="請輸入本次辦理進度、聯繫結果、下一步事項..."/></div>
                    <div className="flex justify-end gap-2">{logDraft.id && <button type="button" onClick={() => resetLogDraft()} className="px-4 py-2 text-slate-500 text-xs font-bold rounded-lg hover:bg-slate-200">取消修改</button>}<button type="button" onClick={saveProgressLog} className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg shadow hover:bg-blue-700">{logDraft.id ? '儲存修改' : '新增進度'}</button></div>
                  </div>}
                  <div className="mt-4"><div className="flex justify-between items-center mb-2"><label className="block text-xs font-bold text-slate-400">進度歷程</label><span className="text-[11px] text-slate-400 font-bold">{executionLogs.length} 筆</span></div><div className="space-y-2 max-h-80 overflow-y-auto border border-slate-100 rounded-xl p-2 bg-white">
                    {executionLogs.length === 0 && <div className="p-4 text-xs text-slate-400">尚無進度紀錄。</div>}
                    {executionLogs.map(log => <div key={log.id} className="progress-card border border-slate-200 rounded-xl p-3 bg-white"><div className="flex flex-wrap gap-2 items-center mb-2"><span className="text-[11px] font-bold rounded-full px-2 py-1 bg-blue-50 text-blue-700 border border-blue-100">{log.date}</span><span className="text-[11px] font-bold rounded-full px-2 py-1 bg-blue-50 text-blue-700 border border-blue-100">{log.person || '未填人員'}</span><span style={tagStyle((progressTypeMap[log.typeId] || progressTypes.find(x => x.label === log.type) || progressTypeMap.OTHER)?.color || '#475569')} className="text-[11px] font-bold rounded-full px-2 py-1 border">{log.type}</span>{!isViewMode && <div className="ml-auto flex gap-1"><button type="button" onClick={() => editProgressLog(log)} className="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded text-xs font-bold">修改</button><button type="button" onClick={() => deleteProgressLog(log.id)} className="text-red-600 hover:bg-red-50 px-2 py-1 rounded text-xs font-bold">刪除</button></div>}</div><div className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{log.content || '未輸入內容'}</div></div>)}
                  </div></div>
                </div>

                <div className="border border-slate-200 rounded-2xl p-5 bg-white space-y-4">
                  <div className="flex items-center justify-between"><div><h4 className="font-bold text-slate-700">待辦事項追蹤</h4><p className="text-xs text-slate-400 mt-1">可建立多筆；未完成待辦會在主畫面提醒。修改後請按下方「儲存變更」才會寫入雲端。</p></div><span className="text-xs text-slate-500">{todos.filter(t=>!t.done).length} 筆未完成／共 {todos.length} 筆</span></div>
                  {!isViewMode&&<div className="rounded-xl bg-slate-50 border p-3 space-y-3">
                    <div><label className="block text-xs font-bold text-slate-500 mb-1">待辦事項 *</label><input value={todoDraft.content} onChange={e=>setTodoDraft({...todoDraft,content:e.target.value})} className="w-full p-2 border rounded-lg bg-white" placeholder="例如：確認廠商測試報告" /></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label className="block text-xs font-bold text-slate-500 mb-1">負責人</label><input list="todo-person-options" value={todoDraft.owner} onChange={e=>setTodoDraft({...todoDraft,owner:e.target.value})} className="w-full p-2 border rounded-lg bg-white" placeholder="可選擇人員或自行輸入"/><datalist id="todo-person-options">{people.filter(x=>x.active).map(x=><option key={x.id} value={x.label}/>)}</datalist></div><div><label className="block text-xs font-bold text-slate-500 mb-1">預定完成日 *</label><input type="date" value={todoDraft.dueDate} onChange={e=>setTodoDraft({...todoDraft,dueDate:e.target.value})} className="w-full p-2 border rounded-lg bg-white"/></div></div>
                    <div><label className="block text-xs font-bold text-slate-500 mb-1">備註</label><textarea rows="2" value={todoDraft.notes} onChange={e=>setTodoDraft({...todoDraft,notes:e.target.value})} className="w-full p-2 border rounded-lg bg-white resize-y" /></div>
                    <div className="flex justify-end gap-2">{todoDraft.id&&<button type="button" onClick={()=>setTodoDraft(emptyTodo())} className="px-3 py-2 text-slate-500 font-bold text-xs">取消修改</button>}<button type="button" onClick={saveTodo} className="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-xs">{todoDraft.id?'儲存待辦修改':'新增待辦'}</button></div>
                  </div>}
                  <div className="space-y-2 max-h-[340px] overflow-y-auto">{todos.length===0&&<p className="text-xs text-slate-400 p-4">尚無待辦事項。</p>}
                    {todos.map(t=><div key={t.id} className="rounded-lg border p-3 bg-white flex items-start gap-3"><input type="checkbox" disabled={isViewMode} checked={t.done} onChange={e=>markTodo(t.id,e.target.checked)} className="mt-1 w-4 h-4"/><div className="flex-1 min-w-0"><div className={`text-sm font-bold whitespace-pre-wrap ${t.done?'text-gray-400 line-through':'text-slate-700'}`}>{t.content}</div><div className="text-xs text-slate-500 mt-1">{t.owner||'未指定負責人'} · 預定 {t.dueDate}</div>{t.done?<div className="text-xs text-green-600 mt-1">已完成：{t.completedAt||'日期未記錄'}</div>:todoAlert(t.dueDate)==='OVERDUE'?<div className="text-xs text-red-600 mt-1">逾期未完成</div>:todoAlert(t.dueDate)==='SOON'?<div className="text-xs text-amber-600 mt-1">30天內到期</div>:null}{t.notes&&<div className="text-xs text-slate-500 whitespace-pre-wrap mt-2">{t.notes}</div>}</div>{!isViewMode&&<div className="flex gap-2 shrink-0"><button type="button" onClick={()=>setTodoDraft({...t})} className="text-blue-600 font-bold text-xs">修改</button><button type="button" onClick={()=>removeTodo(t.id)} className="text-red-600 font-bold text-xs">刪除</button></div>}</div>)}
                  </div>
                </div>
                <div><label className="block text-sm font-bold text-gray-700 mb-1">備註</label><textarea name="description" defaultValue={editingProject?.description || ''} className="w-full p-2.5 border rounded-xl h-20 resize-y bg-white"/></div>
              </fieldset>

              <div className="sticky bottom-0 bg-white/95 backdrop-blur border-t pt-4 pb-1 flex flex-wrap justify-end gap-2">
                {!isViewMode && editingProject && <button type="button" onClick={() => handleDeleteProject(editingProject.id)} className="flex items-center gap-1.5 text-red-500 font-bold text-sm px-4 py-2.5 rounded-xl hover:bg-red-50"><Trash className="w-4 h-4"/> 刪除專案</button>}
                <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2.5 text-gray-500 font-bold hover:bg-gray-100 rounded-xl">{isViewMode ? '關閉' : '取消'}</button>
                {!isViewMode && <button type="submit" className="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700">{editingProject ? '儲存變更' : '建立專案'}</button>}
              </div>
            </form>
          </div></div>}

          {isMasterOpen && <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[70] p-4"><div className="resizable-container w-[900px] h-[72vh]"><div className="bg-slate-800 p-5 flex justify-between items-center text-white shrink-0"><div><h3 className="font-bold text-lg">年度專案｜基本資料管理</h3><p className="text-xs text-slate-300 mt-1">此基本資料僅供「年度安衛環專案管制總表」使用。</p></div><button onClick={() => setIsMasterOpen(false)} className="text-xl">✕</button></div><div className="flex-1 overflow-hidden flex flex-col md:flex-row bg-slate-50">
            <div className="md:w-56 p-4 border-r bg-white flex md:flex-col gap-2 overflow-x-auto">{Object.entries(masterLabels).map(([key,label]) => <button key={key} onClick={() => setMasterTab(key)} className={`px-4 py-3 rounded-xl text-sm font-bold text-left whitespace-nowrap ${masterTab === key ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'text-slate-600 hover:bg-slate-50 border border-transparent'}`}>{label}</button>)}</div>
            <div className="flex-1 p-5 overflow-y-auto"><div className="flex justify-between items-center mb-4"><div><h4 className="font-bold text-slate-800">{masterLabels[masterTab]}</h4><p className="text-xs text-slate-400 mt-1">{masterTab === 'people' ? '設定人員所屬廠區；停用後不再提供新進度勾選，歷史紀錄不受影響。' : '可修改名稱、顏色、啟用狀態與排序；進度類型未被使用時可刪除，已使用者請改為停用。'}</p></div><button onClick={() => addMasterItem(masterTab)} className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg flex items-center gap-1"><Plus className="w-3 h-3"/> 新增</button></div>
              <div className="space-y-2">{currentMasterItems.map((item,idx) => <div key={item.id} className="bg-white border border-slate-200 rounded-xl p-3 flex flex-col md:flex-row gap-3 items-center">
                <div className="text-xs font-mono text-slate-400 w-full md:w-24 truncate" title={item.id}>{item.id}</div>
                <input value={item.label} onChange={e => updateMasterItem(masterTab,item.id,{label:e.target.value})} className="flex-1 p-2 border rounded-lg" placeholder={masterTab === 'people' ? '人員姓名' : '名稱'}/>
                {masterTab === 'people'
                  ? <select value={item.factoryId || ''} onChange={e => updateMasterItem(masterTab,item.id,{factoryId:e.target.value})} className="w-full md:w-44 p-2 border rounded-lg bg-white"><option value="">選擇廠區</option>{[...(masterDraft.factories || [])].sort((a,b) => a.order - b.order).map(factory => <option key={factory.id} value={factory.id}>{factory.label}{factory.active === false ? '（已停用）' : ''}</option>)}</select>
                  : <div className="flex items-center gap-2 shrink-0"><span style={masterTab === 'factories' ? tagStyle(item.color,true) : tagStyle(item.color)} className="px-2 py-1 rounded border text-xs font-bold min-w-14 text-center">{item.label || '預覽'}</span><input type="color" value={normalizeHexColor(item.color)} onChange={e => updateMasterItem(masterTab,item.id,{color:e.target.value})} className="w-10 h-9 p-1 border rounded-lg cursor-pointer bg-white" title="自訂標籤顏色"/></div>}
                <label className="flex items-center gap-2 text-xs font-bold text-slate-600"><input type="checkbox" checked={item.active !== false} disabled={masterTab === 'progressTypes' && item.id === 'OTHER'} onChange={e => updateMasterItem(masterTab,item.id,{active:e.target.checked})}/>啟用</label>
                {masterTab === 'progressTypes' && <button type="button" disabled={item.id === 'OTHER' || isProgressTypeUsed(item)} onClick={() => deleteProgressType(item.id)} title={item.id === 'OTHER' ? '其他為保留類型' : isProgressTypeUsed(item) ? '已有歷史紀錄，只能停用' : '刪除此進度類型'} className="px-2 py-1 border border-red-200 text-red-600 rounded text-xs font-bold disabled:opacity-30 disabled:cursor-not-allowed">刪除</button>}
                <div className="flex gap-1"><button type="button" disabled={idx===0} onClick={() => moveMasterItem(masterTab,item.id,-1)} className="px-2 py-1 border rounded disabled:opacity-30">↑</button><button type="button" disabled={idx===currentMasterItems.length-1} onClick={() => moveMasterItem(masterTab,item.id,1)} className="px-2 py-1 border rounded disabled:opacity-30">↓</button></div>
              </div>)}</div>
            </div>
          </div><div className="p-4 border-t bg-white flex justify-end gap-2"><button onClick={() => setIsMasterOpen(false)} className="px-6 py-2.5 text-gray-500 font-bold rounded-xl hover:bg-gray-100">取消</button><button onClick={saveMaster} className="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow">儲存基本資料</button></div></div></div>}
        </div>
      );
    };

    window.__firebaseReady.then(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
  </script>
<script src="../ehs-home-button.js?v=20261005-1"></script></body>
</html>
