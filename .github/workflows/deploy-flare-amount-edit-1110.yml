name: Deploy FLARE amount edit 1110

on:
  push:
    paths:
      - '.github/workflows/deploy-flare-amount-edit-1110.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enable FLARE amount editor and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('FLARE/index.html')
          s = index.read_text(encoding='utf-8')
          s, n = re.subn(r'from "\.\./firebase-mobile-auth\.js(?:\?v=[^"]+)?";',
                          'from "../firebase-mobile-auth.js?v=20260824-1110";', s, count=1)
          if n != 1:
              raise SystemExit('FLARE auth import not found')
          index.write_text(s, encoding='utf-8')

          auth = Path('firebase-mobile-auth.js')
          s = auth.read_text(encoding='utf-8')
          loader = '''\n    if (!document.querySelector('script[data-ehs-flare-amount-edit]')) {\n      const flareAmountEdit = document.createElement('script');\n      flareAmountEdit.src = './amount-edit.js?v=20260824-1110';\n      flareAmountEdit.defer = true;\n      flareAmountEdit.dataset.ehsFlareAmountEdit = '1';\n      document.head.appendChild(flareAmountEdit);\n    }\n'''
          marker = "    if (!document.querySelector('script[data-ehs-flare-restore-actions]')) {"
          if 'data-ehs-flare-amount-edit' not in s:
              if marker not in s:
                  raise SystemExit('FLARE restore loader marker not found')
              s = s.replace(marker, loader + '\n' + marker, 1)
          auth.write_text(s, encoding='utf-8')

          data_input = Path('FLARE/data-input.html')
          if data_input.exists():
              s = data_input.read_text(encoding='utf-8')
              s = re.sub(r'index\.html\?view=input&layout=[0-9-]+',
                         'index.html?view=input&layout=20260824-1110', s)
              data_input.write_text(s, encoding='utf-8')
          PY

      - name: Commit production update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FLARE/index.html firebase-mobile-auth.js FLARE/data-input.html
          git rm .github/workflows/deploy-flare-amount-edit-1110.yml
          git commit -m 'feat: deploy FLARE amount edit v1110'
          git push origin main
