<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定檢（工檢）工安業務管理</title><link rel="stylesheet" href="styles.css?v=20260918-1"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head>
<body><header><div><a href="../index.html#general">← 綜合管理</a><p class="eyebrow">綜合管理 ／ 年度管制</p><h1>定檢（工檢）工安業務管理</h1></div><div class="account"><span id="account"></span><span id="sync">尚未登入</span><button id="logout" class="secondary" hidden>登出</button></div></header>
<main><section id="gate" class="gate"><h2>年度工安業務執行表</h2><p id="auth-message">正在連接登入服務…</p><button id="login" disabled>使用 Google 帳號登入</button></section>
<div id="app" hidden><section class="toolbar panel"><div class="group"><label>年度<select id="year"></select></label><span id="archive-badge" class="badge" hidden>已封存</span><button id="new-year">＋ 建立新年度</button><button id="archive" class="secondary">封存年度</button></div><div class="group"><button id="import" class="secondary">匯入 Excel</button><button id="export" class="secondary">匯出 Excel</button><button id="print" class="secondary">列印 / PDF</button><button id="add">＋ 新增資料</button></div></section>
<section class="panel"><div class="filters"><label>公司<select id="f-company"><option value="">全部</option></select></label><label>事業部<select id="f-division"><option value="">全部</option></select></label><label>廠區<select id="f-site"><option value="">全部</option></select></label><label>廠處<select id="f-plant"><option value="">全部</option></select></label><label>類型<select id="f-type"><option value="">全部</option></select></label><label>狀態<select id="f-status"><option value="">全部</option><option>未開始</option><option>進行中</option><option>已完成</option><option>逾期</option></select></label><label class="search">搜尋<input id="f-query" type="search" placeholder="單元、地址或日期"></label><button id="reset" class="text">清除篩選</button></div><div class="summary"><span id="count"></span><span>狀態由停俥起訖與管制期限自動判斷。</span></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p id="empty" class="empty" hidden>沒有符合條件的資料。</p></section>
<section class="panel notes"><h2>原表備註</h2><ol id="notes"></ol></section></div></main>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">新增資料</h2><button type="button" data-close>✕</button></div><div id="form-grid" class="form-grid"></div><div class="dialog-actions"><button type="button" data-close class="secondary">取消</button><button type="submit">儲存至雲端</button></div></form></dialog>
<dialog id="import-dialog"><form method="dialog"><h2>Excel 匯入確認</h2><p id="import-summary"></p><label><input id="import-add" type="checkbox"> 將 Excel 中的新資料新增至系統</label><label><input id="import-delete" type="checkbox"> 刪除系統中有、但 Excel 缺少的資料（預設不勾選＝保留）</label><p class="hint">已比對到的資料會更新。比對主鍵依需求採「年度＋廠區＋單元名稱」；若同一主鍵重複，系統會以廠處作為安全性補充辨識，避免誤覆蓋。</p><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="confirm">套用匯入</button></div></form></dialog>
<dialog id="print-dialog"><form method="dialog"><h2>列印 / PDF</h2><label><input type="radio" name="scope" value="all" checked> 全年度完整資料</label><label><input type="radio" name="scope" value="filtered"> 目前篩選結果</label><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="confirm">開啟列印</button></div></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="confirm">確認</button></div></form></dialog>
<input id="file" type="file" accept=".xlsx,.xls" hidden><div id="print-root"></div><script type="module" src="app.js?v=20260918-1"></script></body></html>
